version: 2
build:
  os: ubuntu-lts-latest
  tools:
    rust: latest
  jobs:
    install:
      - cargo install mdbook
    build:
      html:
        - /home/docs/.asdf/installs/rust/1.96.0/bin/mdbook build --dest-dir $READTHEDOCS_OUTPUT/html
        - python3 scripts/canonical.py $READTHEDOCS_OUTPUT/html
        - python3 scripts/description.py $READTHEDOCS_OUTPUT/html