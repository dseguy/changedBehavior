id = "returnInFinallyDeprecated";
title = "Returning From A finally Block Is Deprecated";
description = "A ``return`` statement inside a ``finally`` block always wins: it replaces whatever the ``try``/``catch`` block was about to return, and it silently swallows any exception that was propagating out of the ``try``. Until PHP 8.6, this was fully silent, and a pending exception could disappear without a trace. In PHP 8.6, returning from a finally block emits a deprecation notice, while the runtime behavior itself (the return value winning, the exception being discarded) is unchanged.";
code = "<?php

function getValue(): string {
    try {
        throw new Exception('boom');
    } finally {
        return 'fallback';
    }
}

echo getValue(), \"\\n\";

?>";
before = "fallback
";
after = "PHP Deprecated:  Returning from a finally block is deprecated in /codes/returnInFinallyDeprecated.php on line 7

Deprecated: Returning from a finally block is deprecated in /codes/returnInFinallyDeprecated.php on line 7
fallback
";
seeAlso["PHP 8.6 Deprecations RFC"] = "https://wiki.php.net/rfc/deprecations_php_8_6";
seeAlso["Pre-RFC discussion"] = "https://discourse.thephp.foundation/t/php-dev-pre-rfc-deprecate-returning-from-a-finally-block/5618";
deprecation = "8.6";
phpVersion = "";
alternatives[] = "Move the return statement out of the finally block, into the try or after it.";
alternatives[] = "If overriding the result is intentional, do it explicitly outside the finally block so the discarded value or exception stays visible.";
related[] = "";
keywords[] = "silent_to_visible";
keywords[] = "exception_swallowing";
features[] = "try-finally";
