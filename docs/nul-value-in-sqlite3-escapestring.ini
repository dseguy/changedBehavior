id = "nul-value-in-sqlite3-escapestring";
title = "No Nul Value With sqlite3::escapeString()";
description = "Nul values, \"\\0\" are not accepted in the argument passed to Sqlite3::escapeString(). Until PHP 8.5, it was accepted, but the resulting string would end up being cut at the first occurence of the nul character.";
code = "<?php

echo sqlite3::escapeString("A\\0B");

?>";
before = "A";
after = "PHP Fatal error:  Uncaught ValueError: SQLite3::escapeString(): Argument #1 ($string) must not contain any null bytes in /codes/nul-value-in-sqlite3-escapestring.php";
seeAlso[] = "";
deprecation = "";
phpVersion = "8.5";
alternatives[] = "Use named parameters in the query.";
alternatives[] = "Remove the \\0 in the string";
