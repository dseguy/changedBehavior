id = "procOpenCwdNullByteValueError";
title = "proc_open() Rejects NUL Bytes In The Working Directory";
description = "``proc_open()`` used to accept a ``$cwd`` argument containing a NUL byte and passed the truncated path straight to the operating system, which then failed to spawn the process. In PHP 8.6, a NUL byte in ``$cwd`` throws a ``ValueError`` before attempting to start the process.";
code = "<?php

try {
    var_dump(proc_open('echo hi', [], $pipes, \"foo\\0bar\"));
} catch (\\ValueError $e) {
    echo $e->getMessage(), \"\\n\";
}

?>";
before = "PHP Warning:  proc_open(): posix_spawn() failed: No such file or directory in /codes/procOpenCwdNullByteValueError.php on line 4

Warning: proc_open(): posix_spawn() failed: No such file or directory in /codes/procOpenCwdNullByteValueError.php on line 4
bool(false)
";
after = "proc_open(): Argument #4 ($cwd) must not contain any null bytes
";
seeAlso["proc_open()"] = "https://www.php.net/proc_open";
deprecation = "";
phpVersion = "8.6";
alternatives[] = "Validate the cwd string before calling proc_open(), or catch the ValueError.";
related[] = "getenv()-rejects-nul-bytes-in-the-variable-name";
keywords[] = "now_throw_exception";
features[] = "proc_open";
features[] = "valueerror";
phpError["proc_open(): Argument #4 ($cwd) must not contain any null bytes"] = "proc_open():-argument-#4-($cwd)-must-not-contain-any-null-bytes";
