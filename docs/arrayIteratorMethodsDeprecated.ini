id = "arrayIteratorMethodsDeprecated";
title = "Several ArrayIterator Methods Are Deprecated";
description = "``ArrayIterator`` exposes several methods inherited from its ``ArrayAccess``, ``Countable`` and internal-flags implementation, such as ``getFlags()``, ``setFlags()``, ``asort()`` and ``ksort()``. Until PHP 8.6, calling these methods worked silently. In PHP 8.6, calling ``ArrayIterator::getFlags()``, ``ArrayIterator::setFlags()``, ``ArrayIterator::asort()`` (and several sibling sort methods) each emit their own deprecation notice, while still behaving exactly as before.";
code = "<?php

$it = new ArrayIterator(['b' => 2, 'a' => 1]);

var_dump($it->getFlags());
$it->setFlags(ArrayIterator::ARRAY_AS_PROPS);
var_dump($it->getFlags());
$it->asort();
print_r(iterator_to_array($it));

?>";
before = "int(0)
int(2)
Array
(
    [a] => 1
    [b] => 2
)
";
