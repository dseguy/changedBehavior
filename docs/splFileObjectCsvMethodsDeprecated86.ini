id = "splFileObjectCsvMethodsDeprecated86";
title = "SplFileObject::fgetcsv() And fputcsv() Are Deprecated";
description = "``SplFileObject::fgetcsv()`` and ``SplFileObject::fputcsv()`` read and write one CSV record on the wrapped file. In PHP 8.6, calling either method emits a deprecation notice recommending the plain ``fgetcsv()``/``fputcsv()`` functions on the underlying stream instead; both methods keep their previous behavior otherwise.";
code = "<?php

file_put_contents(sys_get_temp_dir().'/splFileObjectCsvMethodsDeprecated86.csv', \"a,b,c\\n\");

$file = new SplFileObject(sys_get_temp_dir().'/splFileObjectCsvMethodsDeprecated86.csv');
var_dump($file->fgetcsv());

$out = new SplFileObject(sys_get_temp_dir().'/splFileObjectCsvMethodsDeprecated86.out.csv', 'w');
var_dump($out->fputcsv(['x', 'y']));

unlink(sys_get_temp_dir().'/splFileObjectCsvMethodsDeprecated86.csv');
unlink(sys_get_temp_dir().'/splFileObjectCsvMethodsDeprecated86.out.csv');

?>
";
before = "PHP Deprecated:  SplFileObject::fgetcsv(): the $escape parameter must be provided, as its default value will change, either explicitly or via SplFileObject::setCsvControl() in /codes/splFileObjectCsvMethodsDeprecated86.php on line 6

