id = "pgFetchResultTwoArgsDeprecated";
title = "Calling pg_fetch_result() With 2 Arguments Is Deprecated";
description = "``pg_fetch_result()`` accepted two call shapes: a 3-argument form giving the row and field explicitly, and a 2-argument form that omitted the row and implicitly read from an internal, auto-advancing row cursor instead. Mixing an explicit-row API with a stateful, cursor-based one in the same overloaded function made the behavior harder to predict. Until PHP 8.4, calling the 2-argument form was completely silent. In PHP 8.4, it emits a deprecation notice, in favor of always passing 3 arguments and using ``null`` for ``\$row`` when the old auto-advancing behavior is wanted; the underlying validation of the other arguments (here, that \$result is a real PgSql\\Result) is unaffected.";
code = "<?php

try {
    var_dump(pg_fetch_result('not-a-resource', 'field'));
} catch (\\Throwable \$e) {
    echo get_class(\$e), ': ', \$e->getMessage(), \"\\n\";
}
";
before = "TypeError: pg_fetch_result(): Argument #1 ($result) must be of type PgSql\\Result, string given
";
after = "PHP Deprecated:  Calling pg_fetch_result() with 2 arguments is deprecated, use the 3-parameter signature with a null $row parameter instead in /codes/pgFetchResultTwoArgsDeprecated.php on line 4

Deprecated: Calling pg_fetch_result() with 2 arguments is deprecated, use the 3-parameter signature with a null $row parameter instead in /codes/pgFetchResultTwoArgsDeprecated.php on line 4
TypeError: pg_fetch_result(): Argument #1 ($result) must be of type PgSql\\Result, string given
";
seeAlso["PHP RFC: Deprecate functions with overloaded signatures"] = "https://wiki.php.net/rfc/deprecate_functions_with_overloaded_signatures";
seeAlso["pg_fetch_result()"] = "https://www.php.net/manual/en/function.pg-fetch-result.php";
deprecation = "8.4";
phpVersion = "";
alternatives[] = "Always call pg_fetch_result() with 3 arguments, passing null as $row to keep the auto-advancing cursor behavior explicitly.";
alternatives[] = "Track the row index yourself and pass it explicitly, instead of relying on the implicit cursor.";
related[] = "";
keywords[] = "overloaded_signature";
keywords[] = "silent_to_visible";
features[] = "pgsql";
features[] = "deprecation";
extension[] = "pgsql";
phpError["Calling pg_fetch_result() with 2 arguments is deprecated, use the 3-parameter signature with a null $row parameter instead"] = "calling-pg_fetch_result()-with-2-arguments-is-deprecated,";
