id = "setlocaleArrayVariadicTypeError86";
title = "setlocale() Rejects Extra Arguments When $locales Is An Array";
description = "``setlocale()`` accepts either a list of individual locale name arguments, or a single array of candidate locale names as its second parameter. Until PHP 8.6, passing an array as ``$locales`` while also passing further variadic locale arguments was silently accepted, and the extra arguments were ignored. In PHP 8.6, passing any additional locale argument alongside an array ``$locales`` throws a ``TypeError``.";
code = "<?php

try {
    var_dump(setlocale(LC_ALL, ['en_US'], 'fr_FR'));
} catch (\\TypeError $e) {
    echo \"TypeError: \".$e->getMessage().\"\\n\";
}

?>
";
before = "string(5) \"en_US\" 
";
after = "TypeError: setlocale() expects exactly 2 arguments when argument #2 ($locales) is an array, 3 given
";
seeAlso["setlocale()"] = "https://www.php.net/setlocale";
deprecation = "";
phpVersion = "8.6";
alternatives[] = "Pass either a single array of candidate locales, or a plain variadic list of locale strings, but not both.";
related[] = "";
keywords[] = "now_throw_exception";
features[] = "setlocale";
features[] = "typeerror";
phpError["setlocale() expects exactly 2 arguments when argument #2 ($locales) is an array, 3 given"] = "setlocale()-rejects-extra-arguments-when-$locales-is-an-array";
analyzer[] = "none"
