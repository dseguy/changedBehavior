id = "numberFormatDecimalsValueError";
title = "number_format() Validates Its Decimals Argument Range";
description = "``number_format()``'s ``$decimals`` argument is internally clamped to a 32-bit signed integer range (-2147483648 to 2147483647). Until PHP 8.6, a value outside that range was silently clamped, for very negative values this collapsed to 0 decimals, and for very large positive values it could trigger a huge memory allocation while building the result string. In PHP 8.6, an out-of-range value throws a ``ValueError`` instead.";
code = "<?php

try {
    var_dump(number_format(1234.5678, PHP_INT_MIN));
} catch (\\ValueError $e) {
    echo $e->getMessage(), \"\\n\";
}

?>";
before = "string(1) "0"
";
after = "number_format(): Argument #2 ($decimals) must be between -2147483648 and 2147483647
";
seeAlso["number_format()"] = "https://www.php.net/number_format";
deprecation = "";
phpVersion = "8.6";
alternatives[] = "Keep $decimals within the -2147483648 to 2147483647 range, or catch the ValueError.";
related[] = "";
keywords[] = "now_throw_exception";
features[] = "number_format";
features[] = "valueerror";
