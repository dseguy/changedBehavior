id = "overrideAttributeOnProperty85";
title = "Override Attribute Extended To Properties";
description = "The ``#[\Override]`` attribute, introduced in PHP 8.3, could originally only target methods. PHP 8.5 extends it so it can also be applied to properties, telling the engine that the property is expected to override a property of the same name declared in a parent class or an implemented interface, so the engine can check that this is really the case.

If the property marked ``#[\Override]`` has no matching parent property -- because the parent has no property of that name, because the class has no parent at all, or because the property comes from a trait whose using class has no matching parent property -- PHP reports a compile-time error.";
code = "<?php

class X {
    public int \$a = 1;
}

class Y extends X {
    #[\Override]
    public int \$b = 2;
}

?>";
before = "PHP Fatal error:  Attribute \"Override\" cannot target property (allowed targets: method)
";
after = "PHP Fatal error:  Y::\$b has #[\Override] attribute, but no matching parent property exists
";
seeAlso[] = "";
deprecation = "";
phpVersion = "8.5";
alternatives[] = "Remove the ``#[\Override]`` attribute.";
alternatives[] = "Rename the property to match the name used by the parent class or interface.";
alternatives[] = "Add the property, with the same name, to the parent class.";
related[] = "";
keywords[] = "";
features[] = "override";
features[] = "attribute";
features[] = "property";
phpError["%s::\$%s has #[\Override] attribute"] = "%s::\$%s-has-#[--override]-attribute";
analyzer = "none"
