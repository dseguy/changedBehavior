id = "httpBuildQueryObjectDeprecated86";
title = "http_build_query() With An Object Is Deprecated";
description = "``http_build_query()`` accepts an object as its ``$data`` argument and builds the query string from its public properties. Until PHP 8.6, this was silently accepted. In PHP 8.6, passing an object emits a deprecation notice recommending ``get_object_vars()`` first; the resulting query string is unchanged.";
code = "<?php

class Data {
    public $a = 1;
    public $b = 2;
}

var_dump(http_build_query(new Data()));

?>
";
before = "string(7) \"a=1&b=2\" 
";
after = "PHP Deprecated:  http_build_query(): Passing an object for argument #1 $data to http_build_query() is deprecated, call get_object_vars() first instead in /codes/httpBuildQueryObjectDeprecated86.php on line 8

Deprecated: http_build_query(): Passing an object for argument #1 $data to http_build_query() is deprecated, call get_object_vars() first instead in /codes/httpBuildQueryObjectDeprecated86.php on line 8
string(7) \"a=1&b=2\" 
";
seeAlso["http_build_query()"] = "https://www.php.net/http_build_query";
seeAlso["PHP 8.6 NEWS"] = "https://www.php.net/ChangeLog-8.php#8.6.0";
deprecation = "8.6";
phpVersion = "";
alternatives[] = "Pass get_object_vars($object) instead of $object to http_build_query().";
