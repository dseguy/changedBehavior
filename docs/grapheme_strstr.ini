id = "grapheme_strstr";
title = "grapheme_strstr() Matches Precomposed And Decomposed Characters";
description = "``grapheme_strstr()`` returns the part of the haystack starting at the first occurrence of the needle. Until PHP 8.5, a needle containing a precomposed character such as ``é`` (U+00E9) was not found in a haystack that stored the same character in decomposed form, ``e`` followed by a combining acute accent (U+0301), and the function returned ``false``. In PHP 8.6, the two forms are treated as equivalent, so the match is found and the remainder of the haystack is returned.";
code = "<?php

var_dump(grapheme_strstr(\"e\\u{0301}\", \"\\u{00E9}\"));

?>";
before = "bool(false)
";
after = "string(3) \"é\"
";
seeAlso["grapheme_strstr()"] = "https://www.php.net/manual/en/function.grapheme-strstr.php";
seeAlso["Normalizer::normalize()"] = "https://www.php.net/manual/en/normalizer.normalize.php";
deprecation = "";
phpVersion = "8.6";
alternatives[] = "Normalize both the haystack and the needle to the same Unicode normalization form, for example NFC with Normalizer::normalize(), before calling grapheme_strstr(). This gives the same result on every PHP version.";
related[] = "";
keywords[] = "silent";
features[] = "grapheme_strstr";
features[] = "string";
features[] = "unicode";
phpError[] = "none";
analyzer[] = "none";
