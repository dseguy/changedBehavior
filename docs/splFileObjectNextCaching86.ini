id = "splFileObjectNextCaching86";
title = "SplFileObject::next() Always Advances The Stream";
description = "``SplFileObject::next()`` used to only advance to the next line when a prior ``current()`` call had already cached a line internally; without that cache, ``next()`` was a no-op and the following ``current()`` call re-read the same line. In PHP 8.6, ``next()`` unconditionally advances the underlying stream, so a subsequent ``current()`` call always returns the line after the one that was current before ``next()`` was called.";
code = "<?php

$path = tempnam(sys_get_temp_dir(), 'spl');
file_put_contents($path, \"line1\\nline2\\nline3\\n\");

$f = new SplFileObject($path);
$f->next();
var_dump(trim($f->current()));

unlink($path);

?>
";
before = "string(5) \"line1\" 
";
after = "string(5) \"line2\" 
";
seeAlso["SplFileObject::next()"] = "https://www.php.net/splfileobject.next";
deprecation = "";
phpVersion = "8.6";
alternatives[] = "Call current() once before next() if the old caching behavior is required, or switch to fgets() in a loop.";
related[] = "";
keywords[] = "silent";
features[] = "splfileobject";
features[] = "spl";
