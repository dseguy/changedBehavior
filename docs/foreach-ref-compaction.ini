id = "foreach-ref-compaction";
title = "Foreach Reference Compaction";
description = "A ``foreach`` loop by reference walks an array that the loop body changes. In this example, the inner loop unsets the first two elements and adds a new key ``'x'`` while it is on the value ``1``. Up to PHP 8.3, the loop visited the remaining elements, including the new one. In PHP 8.4 and 8.5, the loop stopped after ``1`` and skipped the elements that the array compaction moved. In PHP 8.6, the loop visits them again, so the output is ``0``, ``1``, ``2`` and ``3``.";
code = "<?php
$a = [0, 1, 2];

foreach ($a as &$outer) {
    foreach ($a as &$value) {
        echo $value, "\n";

        if ($value === 1) {
            unset($a[0], $a[1]);
            $a['x'] = 3;
        }
    }
    break;
}
unset($outer, $value);";
before = "0
1
";
after = "0
1
2
3
";
seeAlso["foreach"] = "https://www.php.net/manual/en/control-structures.foreach.php";
deprecation = "";
phpVersion = "8.6";
alternatives[] = "Iterate over a copy of the array, with a by-value foreach, when the loop body modifies the array.";
alternatives[] = "Avoid unset() and new keys on the array being iterated by reference: collect the changes and apply them after the loop.";
related[] = "";
keywords[] = "silent";
features[] = "foreach";
features[] = "array";
features[] = "reference";
phpError[] = "none";
analyzer[] = "none";
extension[] = "Core";
