id = "streamContextSetOptionTwoArgsDeprecated";
title = "Calling stream_context_set_option() With 2 Arguments Is Deprecated";
description = "``stream_context_set_option()`` accepted two call shapes: a 4-argument form setting a single ``wrapper``/``option``/``value`` triple, and a 2-argument form that instead took a whole nested ``[\"wrapper\"][\"option\"] = value`` array in place of the last three arguments. PHP 8.3 added a dedicated ``stream_context_set_options()`` function for that array form. Until PHP 8.4, calling the 2-argument array form was completely silent. In PHP 8.4, it emits a deprecation notice in favor of the new function; the context is still updated exactly as before, and the call still returns true.";
code = "<?php

\$context = stream_context_create();
var_dump(stream_context_set_option(\$context, ['http' => ['method' => 'POST']]));
";
before = "bool(true)
";
after = "PHP Deprecated:  Calling stream_context_set_option() with 2 arguments is deprecated, use stream_context_set_options() instead in /codes/streamContextSetOptionTwoArgsDeprecated.php on line 4

Deprecated: Calling stream_context_set_option() with 2 arguments is deprecated, use stream_context_set_options() instead in /codes/streamContextSetOptionTwoArgsDeprecated.php on line 4
bool(true)
";
seeAlso["PHP RFC: Deprecate functions with overloaded signatures"] = "https://wiki.php.net/rfc/deprecate_functions_with_overloaded_signatures";
seeAlso["stream_context_set_options()"] = "https://www.php.net/manual/en/function.stream-context-set-options.php";
deprecation = "8.4";
phpVersion = "";
alternatives[] = "Use stream_context_set_options($context, $options) instead of stream_context_set_option($context, $options) for the array form.";
alternatives[] = "Use the 4-argument form, stream_context_set_option($context, $wrapper, $option, $value), to set a single option.";
related[] = "";
keywords[] = "overloaded_signature";
keywords[] = "silent_to_visible";
features[] = "streams";
features[] = "deprecation";
extension[] = "standard";
phpError["Calling stream_context_set_option() with 2 arguments is deprecated, use stream_context_set_options() instead"] = "calling-stream_context_set_option()-with-2-arguments-is-deprecated,";
analyzer[] = "none"
