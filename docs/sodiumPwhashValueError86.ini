id = "sodiumPwhashValueError86";
title = "sodium_crypto_pwhash_str() Throws ValueError For Out-Of-Range Limits";
description = "The password-hashing functions ``sodium_crypto_pwhash()``, ``sodium_crypto_pwhash_str()``, ``sodium_crypto_pwhash_scryptsalsa208sha256()`` and ``sodium_crypto_pwhash_scryptsalsa208sha256_str()`` validate their ``$opslimit`` and ``$memlimit`` arguments against libsodium's documented minimums. Until PHP 8.6, an out-of-range value threw a ``SodiumException``. In PHP 8.6, it throws a ``ValueError`` instead, which better reflects that the problem is an invalid argument rather than an internal libsodium failure. ``SodiumException`` is still thrown for genuine libsodium failures.";
code = "<?php

try {
    $hash = sodium_crypto_pwhash_str('password', 1, 1);
    var_dump($hash);
} catch (\\ValueError $e) {
    echo \"ValueError: \".$e->getMessage().\"\\n\";
} catch (\\SodiumException $e) {
    echo \"SodiumException: \".$e->getMessage().\"\\n\";
}

?>
";
before = "SodiumException: sodium_crypto_pwhash_str(): Argument #3 ($memlimit) must be greater than or equal to 8192
";
after = "ValueError: sodium_crypto_pwhash_str(): Argument #3 ($memlimit) must be greater than or equal to 8192
";
seeAlso["sodium_crypto_pwhash_str()"] = "https://www.php.net/sodium_crypto_pwhash_str";
deprecation = "";
phpVersion = "8.6";
alternatives[] = "Catch ValueError instead of, or in addition to, SodiumException when validating opslimit and memlimit.";
related[] = "";
keywords[] = "now_throw_exception";
features[] = "sodium";
features[] = "valueerror";
phpError["sodium_crypto_pwhash_str(): Argument #3 ($memlimit) must be greater than or equal to 8192"] = "sodium_crypto_pwhash_str()-throws-valueerror-for-out-of-range-limits";
analyzer[] = "none"
