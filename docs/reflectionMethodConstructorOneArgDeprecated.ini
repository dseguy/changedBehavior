id = "reflectionMethodConstructorOneArgDeprecated";
title = "ReflectionMethod Constructor With A Single Argument Is Deprecated";
description = "``ReflectionMethod::__construct()`` accepted two call shapes: two arguments, ``new ReflectionMethod(\$classOrObject, \$methodName)``, or a single string combining both as ``\"Class::method\"``. PHP 8.3 added ``ReflectionMethod::createFromMethodName()`` as a dedicated factory method for that single-string form. Until PHP 8.4, calling the constructor with just the combined string was completely silent. In PHP 8.4, it emits a deprecation notice in favor of the new factory method; the object it constructs, and the rest of the Reflection API, are unaffected.";
code = "<?php

\$m = new ReflectionMethod('DateTime::format');
echo \$m->getName(), \"\\n\";
";
before = "format
";
after = "PHP Deprecated:  Calling ReflectionMethod::__construct() with 1 argument is deprecated, use ReflectionMethod::createFromMethodName() instead in /codes/reflectionMethodConstructorOneArgDeprecated.php on line 3

Deprecated: Calling ReflectionMethod::__construct() with 1 argument is deprecated, use ReflectionMethod::createFromMethodName() instead in /codes/reflectionMethodConstructorOneArgDeprecated.php on line 3
format
";
seeAlso["PHP RFC: Deprecate functions with overloaded signatures"] = "https://wiki.php.net/rfc/deprecate_functions_with_overloaded_signatures";
seeAlso["ReflectionMethod::createFromMethodName()"] = "https://www.php.net/manual/en/reflectionmethod.createfrommethodname.php";
deprecation = "8.4";
phpVersion = "";
alternatives[] = "Use ReflectionMethod::createFromMethodName('Class::method') instead of new ReflectionMethod('Class::method').";
alternatives[] = "Use the 2-argument constructor, new ReflectionMethod($classOrObject, $methodName), when the class and method are already available separately.";
related[] = "";
keywords[] = "overloaded_signature";
keywords[] = "silent_to_visible";
features[] = "reflection";
features[] = "deprecation";
extension[] = "Reflection";
