id = "splObjectHashDeprecated";
title = "spl_object_hash() Is Deprecated";
description = "``spl_object_hash()`` returns a string uniquely identifying an object for the lifetime of that object. In PHP 8.6, calling ``spl_object_hash()`` emits a deprecation notice, in favor of ``spl_object_id()``, which returns an integer identifier instead of a string and is cheaper to compute. The function still returns a value in PHP 8.6.";
code = "<?php

$obj = new stdClass();
var_dump(spl_object_hash($obj));

?>";
before = "string(32) \"0000000038bff86f0000000058eaf75e\" 
";
after = "PHP Deprecated:  Function spl_object_hash() is deprecated since 8.6, consider using spl_object_id() instead in /codes/splObjectHashDeprecated.php on line 4

Deprecated: Function spl_object_hash() is deprecated since 8.6, consider using spl_object_id() instead in /codes/splObjectHashDeprecated.php on line 4
string(32) \"00000000000000010000000000000000\" 
";
seeAlso["spl_object_hash()"] = "https://www.php.net/spl_object_hash";
seeAlso["spl_object_id()"] = "https://www.php.net/spl_object_id";
deprecation = "8.6";
phpVersion = "";
alternatives[] = "Use spl_object_id() to identify an object, or spl_object_hash() replaced by a custom string built from spl_object_id() if a string is required.";
related[] = "";
keywords[] = "deprecated";
features[] = "spl";
features[] = "object";
extension[] = "SPL";
