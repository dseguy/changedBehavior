id = "magicPropertyIssetGet86";
title = "isset()-Materialized Magic Property Skips __get()";
description = "?? and empty() on an inaccessible property call __isset() first. If __isset() materializes the property, by writing directly into the object's property table, for example $this->$name = ..., PHP 8.6 returns that freshly-written value directly instead of calling __get() afterwards. Until PHP 8.6, __get() was still called even though the property now exists, and its return value was used instead of the value __isset() had just written. Plain isset() is unaffected by this change.";
code = "<?php

#[AllowDynamicProperties]
class Magic {
    public function __isset($name) {
        echo \"__isset($name) called\\n\";
        $this->$name = 'materialized-by-isset';
        return true;
    }
    public function __get($name) {
        echo \"__get($name) called\\n\";
        return 'from __get';
    }
}

$m = new Magic();
var_dump($m->x ?? 'default');

?>
";
before = "__isset(x) called
__get(x) called
string(10) \"from __get\" 
";
after = "__isset(x) called
string(21) \"materialized-by-isset\" 
";
seeAlso["PHP 8.6 UPGRADING"] = "https://github.com/php/php-src/blob/master/UPGRADING";
deprecation = "";
phpVersion = "8.6";
alternatives[] = "Read the property through a normal property access ($obj->prop) rather than ?? or empty() if __get()'s value is required.";
alternatives[] = "Keep __isset() free of side effects so it does not materialize the property.";
related[] = "";
keywords[] = "silent";
features[] = "magic-methods";
features[] = "__isset";
features[] = "__get";
features[] = "null-coalescing";
phpError[] = "none";
analyzer[] = "none"
