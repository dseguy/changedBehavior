id = "unpackModifierKeyStripped86";
title = "unpack() Strips Endianness Modifiers From The Result Key";
description = "``unpack()`` format codes accept an endianness modifier, such as ``<`` for little-endian or ``>`` for big-endian, directly after the type code. Until PHP 8.6, a modifier placed right before the slash-separated key, such as ``s<value``, was not recognized as a modifier there and was kept as part of the resulting array key, so the key became ``<value`` instead of ``value``. In PHP 8.6, the modifier is recognized and stripped in that position too, so the key is the clean ``value``.";
code = "<?php

var_dump(unpack(\"s<value\", pack(\"s\", 5)));

?>
";
before = "array(1) {
  [\"<value\"]=>
  int(5)
}
";
after = "array(1) {
  [\"value\"]=>
  int(5)
}
";
seeAlso["unpack()"] = "https://www.php.net/unpack";
seeAlso["PHP 8.6 NEWS"] = "https://www.php.net/ChangeLog-8.php#8.6.0";
deprecation = "";
phpVersion = "8.6";
alternatives[] = "Do not rely on the leading modifier character being present in the array key returned by unpack(); use the key exactly as written after the modifier.";
related[] = "unpack_arrays_with_strings";
keywords[] = "unpack";
keywords[] = "pack";
features[] = "unpack";
extension[] = "";
phpError[] = ""
analyzer[] = "none"
