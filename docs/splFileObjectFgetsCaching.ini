id = "splFileObjectFgetsCaching";
title = "SplFileObject::fgets() No Longer Caches The Current Line";
description = "``SplFileObject::fgets()`` used to cache the line it read so that a following ``current()`` call returned that same cached line instead of reading again. It also let ``next()`` be called past end-of-file an unlimited number of times, incrementing ``key()`` without bound. In PHP 8.6, ``fgets()`` no longer caches the line for ``current()``, so ``current()`` now reads and returns the next line from the stream; ``next()`` past EOF is now a no-op, so ``key()`` stops advancing once the end of the file is reached.";
code = "<?php

$path = tempnam(sys_get_temp_dir(), 'spl');
file_put_contents($path, \"line1\\nline2\\nline3\\n\");

$f = new SplFileObject($path);
var_dump(trim($f->fgets()));
var_dump(trim($f->current()));

for ($i = 0; $i < 5; $i++) {
    $f->next();
}
var_dump($f->key());

unlink($path);

?>";
before = "string(5) "line1"
string(5) "line1"
int(5)
";
after = "string(5) "line1"
string(5) "line2"
int(3)
";
seeAlso["SplFileObject::fgets()"] = "https://www.php.net/splfileobject.fgets";
seeAlso["SplFileObject::current()"] = "https://www.php.net/splfileobject.current";
seeAlso["SplFileObject::next()"] = "https://www.php.net/splfileobject.next";
seeAlso["SplFileObject::key()"] = "https://www.php.net/splfileobject.key";
deprecation = "";
phpVersion = "8.6";
alternatives[] = "Do not rely on current() to return the line previously read by fgets(); capture the return value of fgets() directly instead. Do not rely on key() growing past the last line of the file after repeated next() calls.";
related[] = "splFileObjectNextCaching86";
keywords[] = "silent";
