id = "enumDebugInfo86";
title = "Enums May Now Define __debugInfo()";
description = "Declaring the magic method ``__debugInfo()`` on an ``enum`` used to be a compile-time fatal error, because enum cases were treated like other magic methods that make no sense on enums. In PHP 8.6, ``__debugInfo()`` is allowed on enums, so ``var_dump()`` can render a custom representation of an enum case instead of the default one.";
code = "<?php

enum Suit {
    case Hearts;
    case Spades;

    public function __debugInfo(): array {
        return ['custom' => $this->name];
    }
}

var_dump(Suit::Hearts);

?>
";
before = "PHP Fatal error:  Enum Suit cannot include magic method __debugInfo in /codes/enumDebugInfo86.php on line 3
Stack trace:
#0 {main}

Fatal error: Enum Suit cannot include magic method __debugInfo in /codes/enumDebugInfo86.php on line 3
Stack trace:
#0 {main}
";
after = "enum(Suit::Hearts) (1) {
  [\"custom\"]=>
  string(6) \"Hearts\" 
}
";
seeAlso["var_dump()"] = "https://www.php.net/var_dump";
deprecation = "";
phpVersion = "8.6";
alternatives[] = "Wrap the enum in a class, or expose a dedicated debugging method, if targeting PHP 8.5 or older.";
