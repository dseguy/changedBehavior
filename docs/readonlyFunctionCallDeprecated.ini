id = "readonlyFunctionCallDeprecated";
title = "Calling A Function Named readonly() Is Deprecated";
description = "``readonly`` has been a semi-reserved word since PHP 8.1, when it became the modifier for readonly properties and classes. It could still be used as the name of a function, class, or constant, and PHP even special-cased a global function literally called ``readonly()`` so that WordPress, which ships one, kept working. Until PHP 8.6, declaring and calling such a function produced no warning at all. In PHP 8.6, calling a function named ``readonly()`` emits a deprecation notice on every call, in preparation for the word becoming fully reserved.";
code = "<?php

function readonly() {
    return 'not a property modifier';
}

echo readonly(), \"\\n\";

?>";
before = "not a property modifier
";
after = "PHP Deprecated:  Calling a function \"readonly\" is deprecated in /codes/readonlyFunctionCallDeprecated.php on line 7

Deprecated: Calling a function \"readonly\" is deprecated in /codes/readonlyFunctionCallDeprecated.php on line 7
not a property modifier
";
seeAlso["PHP 8.6 Deprecations RFC"] = "https://wiki.php.net/rfc/deprecations_php_8_6";
seeAlso["PHP 8.6 NEWS"] = "https://www.php.net/ChangeLog-8.php#8.6.0";
deprecation = "8.6";
phpVersion = "";
alternatives[] = "Rename the function to something that is not readonly(), e.g. readonlyValue() or getReadonly().";
related[] = "";
keywords[] = "reserved_word";
keywords[] = "wordpress_compatibility";
features[] = "readonly";
features[] = "deprecation";
extension[] = "Core";
phpError["Calling a function \"readonly\" is deprecated"] = "calling-a-function-“readonly”-is-deprecated";
analyzer[] = "none"
