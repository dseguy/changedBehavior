id = "linkinfoEmptyPathValueError";
title = "linkinfo() Rejects An Empty Path";
description = "``linkinfo()`` used to accept an empty string as its path argument, emit a warning and return ``-1``. In PHP 8.6, an empty path throws a ``ValueError``.";
code = "<?php

var_dump(linkinfo(''));

?>";
before = "PHP Warning:  linkinfo(): No such file or directory

Warning: linkinfo(): No such file or directory
int(-1)
";
after = "linkinfo(): Argument #1 ($path) must not be empty";
seeAlso["linkinfo()"] = "https://www.php.net/linkinfo";
deprecation = "";
phpVersion = "8.6";
alternatives[] = "Check that the path is not an empty string before calling linkinfo().";
related[] = "valueerror";
keywords[] = "now_throw_exception";
keywords[] = "error after";
features[] = "valueerror";
phpError["linkinfo(): Argument #1 ($path) must not be empty"] = "linkinfo():-argument-#1-($path)-must-not-be-empty";
analyzer[] = "none"
