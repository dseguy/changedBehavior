id = "staticClosureIdentityCaching86";
title = "Stateless Static Closures Are Cached And Reused";
description = "A ``static`` closure that captures nothing, no ``use()`` variables, no ``$this``, is a stateless closure. Until PHP 8.6, each evaluation of such a closure literal created a brand new ``Closure`` object, so two closures built from the exact same code were never identical. In PHP 8.6, the engine creates the object once and reuses it on every subsequent evaluation, so two stateless static closures built from the same code are now the same object.";
code = "<?php

function make() {
    return static function () {
        return 1;
    };
}

var_dump(make() === make());

?>
";
before = "bool(false)
";
after = "bool(true)
";
seeAlso["Closures"] = "https://www.php.net/manual/en/class.closure.php";
seeAlso["PHP 8.6 NEWS"] = "https://www.php.net/ChangeLog-8.php#8.6.0";
deprecation = "";
phpVersion = "8.6";
alternatives[] = "Do not rely on distinct object identity for stateless static closures, for example as array keys or SplObjectStorage keys expecting one entry per call site; use spl_object_id() only if you actually need per-instance tracking of non-stateless closures.";
related[] = "";
