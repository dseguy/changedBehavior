id = "pregGrepPcreError86";
title = "preg_grep() Returns false On A PCRE Execution Error";
description = "``preg_grep()`` filters an array using a regular expression. Until PHP 8.6, when the underlying PCRE engine failed on one of the array's entries (for example malformed UTF-8 input combined with the ``/u`` modifier), that entry was silently skipped and a partial array was returned for the rest. In PHP 8.6, ``preg_grep()`` returns ``false`` as soon as a PCRE execution error occurs, matching the behavior of the other ``preg_*`` functions.";
code = "<?php

$arr = [\"\\xC3\\x28\", 'valid'];
var_dump(preg_grep('/./u', $arr));

?>
";
before = "array(0) {
}
";
after = "bool(false)
";
seeAlso["preg_grep()"] = "https://www.php.net/preg_grep";
deprecation = "";
phpVersion = "8.6";
alternatives[] = "Check preg_last_error() after calling preg_grep(), and validate input encoding before matching with the /u modifier.";
related[] = "";
keywords[] = "silent";
features[] = "preg_grep";
features[] = "pcre";
phpError[] = "none";
analyzer[] = "none"
