id = "usleepOverflowValueError86";
title = "usleep() Validates Its Microseconds Argument Range";
description = "``usleep()``'s ``$microseconds`` argument is passed to the operating system as an unsigned integer. Until PHP 8.6, a value greater than ``UINT_MAX`` (4294967295) silently overflowed, which could make the function sleep for a much shorter time than requested. In PHP 8.6, a value greater than ``UINT_MAX`` throws a ``ValueError`` instead.";
code = "<?php

try {
    var_dump(usleep(4294967296));
} catch (\\ValueError $e) {
    echo \"ValueError: \".$e->getMessage().\"\\n\";
}

?>
";
before = "NULL
";
after = "ValueError: usleep(): Argument #1 ($microseconds) must be between 0 and 4294967295
";
seeAlso["usleep()"] = "https://www.php.net/usleep";
deprecation = "";
phpVersion = "8.6";
alternatives[] = "Keep $microseconds within the 0 to 4294967295 range, or catch the ValueError.";
