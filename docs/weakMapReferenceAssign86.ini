id = "weakMapReferenceAssign86";
title = "WeakMap Allows Reference Assignment To A Missing Key";
description = "Taking a reference to a ``WeakMap`` offset with ``=&`` used to require the key to already be present in the map, otherwise PHP threw an ``Error`` saying the object was not contained in the ``WeakMap``. In PHP 8.6, a reference assignment on a missing key first creates the entry, exactly like ``$array[$key] =& $ref`` does for a regular array, and then binds the reference to it.";
code = "<?php

$map = new WeakMap();
$obj = new stdClass();

$ref =& $map[$obj];
$ref = 'value via reference';

var_dump($map[$obj]);

?>
";
before = "PHP Fatal error:  Uncaught Error: Object stdClass#2 not contained in WeakMap in /codes/weakMapReferenceAssign86.php:6
