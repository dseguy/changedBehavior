id = "GLOBALSAppend";
title = "Appending To $GLOBALS";
description = "$GLOBALS is not a regular array: each of its entries is really a reference to a variable in the global scope, identified by its name. Appending to it with the empty-bracket operator, which would normally pick the next integer key, has no matching global variable to bind to. Before PHP 8.1, this meaningless operation was silently tolerated, and created a global variable literally named \"0\". As of PHP 8.1, $GLOBALS is treated more strictly by the compiler, and this and several other previously-tolerated usages now raise a compile-time error instead.";
code = "<?php

\$GLOBALS[] = 'value';

?>";
before = "";
after = "PHP Fatal error:  Cannot append to \$GLOBALS
";
seeAlso[] = "";
deprecation = "";
phpVersion = "8.1";
alternatives[] = "Assign to an explicit, named key instead: \$GLOBALS['name'] = 'value';";
related[] = "";
keywords[] = "";
features[] = "$globals";
phpError["Cannot append to \$GLOBALS"] = "cannot-append-to-\$globals";
analyzer = "none"
