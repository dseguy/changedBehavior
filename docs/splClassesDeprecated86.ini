id = "splClassesDeprecated86";
title = "spl_classes() Is Deprecated";
description = "``spl_classes()`` returns an array naming the classes and interfaces provided by the SPL extension. In PHP 8.6, calling it emits a deprecation notice recommending ``ReflectionExtension::getClassNames()`` instead; the returned array is unchanged.";
code = "<?php

$classes = spl_classes();
var_dump(count($classes));

?>
";
