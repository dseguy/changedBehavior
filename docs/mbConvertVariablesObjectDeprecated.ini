id = "mbConvertVariablesObjectDeprecated";
title = "Passing An Object To mb_convert_variables() Is Deprecated";
description = "``mb_convert_variables()`` accepts one or more variables by reference and converts their character encoding in place; historically, an object passed as one of these variables had its accessible public properties converted, just like an array. Until PHP 8.6, this worked silently. In PHP 8.6, passing an object to ``mb_convert_variables()`` emits a deprecation notice suggesting ``get_object_vars()`` first, even though the conversion still happens exactly as before.";
code = "<?php

\$o = new stdClass();
\$o->a = \"abc\";
\$o->b = \"def\";

\$from = mb_convert_variables(\"UTF-8\", \"auto\", \$o);
var_dump(\$from);
var_dump(\$o);

?>
";
before = "string(5) \"ASCII\" 
object(stdClass)#1 (2) {
  [\"a\"]=>
  string(3) \"abc\" 
  [\"b\"]=>
  string(3) \"def\" 
}
";
after = "PHP Deprecated:  mb_convert_variables(): Passing an object for argument #3 $vars to mb_convert_variables() is deprecated, call get_object_vars() first instead in /codes/mbConvertVariablesObjectDeprecated.php on line 7

Deprecated: mb_convert_variables(): Passing an object for argument #3 $vars to mb_convert_variables() is deprecated, call get_object_vars() first instead in /codes/mbConvertVariablesObjectDeprecated.php on line 7
string(5) \"ASCII\" 
object(stdClass)#1 (2) {
  [\"a\"]=>
  string(3) \"abc\" 
  [\"b\"]=>
  string(3) \"def\" 
}
";
seeAlso["mb_convert_variables()"] = "https://www.php.net/mb_convert_variables";
seeAlso["get_object_vars()"] = "https://www.php.net/get_object_vars";
deprecation = "8.6";
phpVersion = "";
alternatives[] = "Call get_object_vars($obj) to get an array of the object's accessible properties, convert that array with mb_convert_variables(), then reassign the properties back if mutation is needed.";
