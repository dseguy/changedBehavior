id = "domAsymmetricVisibility";
title = "DOM Readonly Properties Use Asymmetric Visibility";
description = "Properties previously documented as readonly, such as ``DOMNode::$nodeType``, ``DOMDocument::$xmlEncoding``, ``DOMEntity::$actualEncoding``, ``$encoding`` and ``$version``, are now declared with asymmetric visibility (``public private(set)``). Writing to them from outside the class still fails, but the error message and its wording changed.";
code = "<?php

$doc = new DOMDocument();
$doc->loadXML('<root/>');

try {
    $doc->xmlEncoding = 'UTF-8';
} catch (\\Error $e) {
    echo get_class($e), ': ', $e->getMessage(), \"\\n\";
}

?>";
before = "Error: Cannot modify readonly property DOMDocument::$xmlEncoding
";
after = "Error: Cannot modify private(set) property DOMDocument::$xmlEncoding from global scope
";
seeAlso["DOMDocument"] = "https://www.php.net/manual/en/class.domdocument.php";
deprecation = "";
phpVersion = "8.6";
alternatives[] = "Code that catches the readonly-property Error message text must be updated to match the new private(set) wording. ReflectionProperty::isWritable() reports these properties accurately.";
related[] = "";
keywords[] = "error message change";
features[] = "dom";
phpError[] = "none";
analyzer[] = "none"
