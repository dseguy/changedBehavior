id = "constructorAsGenerator";
title = "Making A Constructor A Generator Is Deprecated";
description = "Using ``yield`` anywhere in the body of ``__construct()`` turns it into a Generator function. Because a Generator's body only starts running once it is iterated, and nothing iterates a constructor, the code inside such a constructor never runs when the object is created with ``new``: initialization is silently skipped. Since this pattern is virtually always a mistake, PHP 8.6 deprecates making a constructor a Generator.";
code = "<?php

class X {
    public function __construct() {
        yield 1;
    }
}

new X;

?>";
before = "";
after = "PHP Deprecated:  Making a constructor a Generator is deprecated in /codes/constructorAsGenerator.php on line 4

Deprecated: Making a constructor a Generator is deprecated in /codes/constructorAsGenerator.php on line 4
";
seeAlso["Generator overview"] = "https://www.php.net/manual/en/language.generators.overview.php";
seeAlso["Constructors and destructors"] = "https://www.php.net/manual/en/language.oop5.decon.php";
deprecation = "8.6";
phpVersion = "8.6";
alternatives[] = "Move the code that uses ``yield`` into a separate, regular method, and call it (or return its Generator) explicitly instead of relying on ``__construct()``.";
alternatives[] = "If the constructor only needs to assign properties, replace ``yield`` with plain assignments.";
