id = "gmpPowmDivisionByZero";
title = "gmp_powm() Reports More Detail On Modulo-By-Zero";
description = "``gmp_powm()`` has thrown a ``DivisionByZeroError`` when its ``$modulus`` argument is zero since PHP 8.0; this is not new in PHP 8.6. Until PHP 8.6, the exception message was the generic ``Modulo by zero``, giving no clue about which function or argument caused it. In PHP 8.6, the message is prefixed with the function name and the offending argument, becoming ``gmp_powm(): Argument #3 ($modulus) Modulo by zero``.";
code = "<?php

try {
    var_dump(gmp_strval(gmp_powm(2, 3, 0)));
} catch (\\DivisionByZeroError $e) {
    echo \"DivisionByZeroError: \".$e->getMessage().\"\\n\";
}

?>
";
before = "DivisionByZeroError: Modulo by zero
";
after = "DivisionByZeroError: gmp_powm(): Argument #3 ($modulus) Modulo by zero
";
seeAlso["gmp_powm"] = "https://www.php.net/gmp_powm";
seeAlso["DivisionByZeroError"] = "https://www.php.net/class.divisionbyzeroerror";
deprecation = "";
phpVersion = "8.6";
alternatives[] = "Check that the modulus is non-zero before calling gmp_powm(), or catch DivisionByZeroError; the exception class is unchanged, only its message text is more detailed.";
related[] = "";
keywords[] = "error_message";
features[] = "gmp";
features[] = "divisionbyzeroerror";
extension[] = "gmp";
phpError["gmp_powm(): Argument #3 ($modulus) Modulo by zero"] = "gmp_powm()-reports-more-detail-on-modulo-by-zero";
analyzer[] = "none"
