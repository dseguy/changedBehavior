id = "constructorReturnDeprecated";
title = "Returning A Value From A Constructor Is Deprecated";
description = "A constructor's return value was always ignored by PHP, silently. In PHP 8.6, returning any value, other than not returning at all, from ``__construct()`` emits a deprecation notice. The same applies to ``__destruct()``.";
code = "<?php

class x {
    public function __construct() {
        return 5;
    }
}

new x();
print \"done\n\";

?>";
before = "done
";
after = "PHP Deprecated:  Returning a value from a constructor is deprecated

Deprecated: Returning a value from a constructor is deprecated
done
";
seeAlso["PHP 8.6 NEWS"] = "https://www.php.net/ChangeLog-8.php#8.6.0";
deprecation = "8.6";
phpVersion = "";
alternatives[] = "Remove the return statement, or make it return without a value.";
related[] = "";
keywords[] = "";
features[] = "constructor";
features[] = "deprecation";
phpError["Returning a value from a constructor is deprecated"] = "returning-a-value-from-a-constructor-is-deprecated";
analyzer[] = "none"
