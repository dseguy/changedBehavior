id = "parseStrNullByteValueError";
title = "parse_str() Rejects NUL Bytes In The Query String";
description = "``parse_str()`` used to accept a query string containing a NUL byte and silently parsed only the part before it. In PHP 8.6, a NUL byte in the ``$string`` argument throws a ``ValueError``.";
code = "<?php

try {
    parse_str(\"foo\\0bar=1\", $result);
    var_dump($result);
} catch (\\ValueError $e) {
    echo $e->getMessage(), \"\\n\";
}

?>";
before = "array(1) {
  ["foo"]=>
  string(0) ""
}
";
after = "parse_str(): Argument #1 ($string) must not contain any null bytes
";
seeAlso["parse_str()"] = "https://www.php.net/parse_str";
deprecation = "";
phpVersion = "8.6";
alternatives[] = "Validate the string before calling parse_str(), or catch the ValueError.";
related[] = "getenv()-rejects-nul-bytes-in-the-variable-name";
keywords[] = "now_throw_exception";
features[] = "parse_str";
features[] = "valueerror";
phpError["parse_str(): Argument #1 ($string) must not contain any null bytes"] = "parse_str():-argument-#1-($string)-must-not-contain-any-null-bytes";
analyzer[] = "none"
