id = "curl_close_cookie_flush";
title = "curl_close() No Longer Flushes The Cookie Jar";
description = "Prior to PHP 8.0, calling ``curl_close()`` on a handle that used a cookie jar would immediately write the collected cookies to disk, since the underlying resource was destroyed right away. Since PHP 8.0, cURL handles are objects, and ``curl_close()`` no longer destroys the handle: it only becomes a no-op that keeps the handle usable, so the cookie jar file is not written anymore until the object is actually garbage collected. Code relying on ``curl_close()`` to flush cookies to disk should instead call ``curl_setopt($handle, CURLOPT_COOKIELIST, \"FLUSH\")`` before closing the handle. Since PHP 8.5, calling ``curl_close()`` at all raises a deprecation notice, as core has confirmed the function has had no effect since 8.0.";
code = "<?php

$jar = tempnam(sys_get_temp_dir(), 'cookiejar');

$ch = curl_init('https://httpbin.org/cookies/set?test=value');
curl_setopt($ch, CURLOPT_COOKIEFILE, '');
curl_setopt($ch, CURLOPT_COOKIEJAR, $jar);
curl_setopt($ch, CURLOPT_RETURNTRANSFER, true);
curl_exec($ch);
curl_close($ch);

var_dump(filesize($jar) > 0);

unlink($jar);

?>";
before = "bool(true)
";
after = "bool(false)
";
seeAlso["curl_close"] = "https://www.php.net/manual/en/function.curl-close.php";
seeAlso["CURLOPT_COOKIELIST"] = "https://www.php.net/manual/en/function.curl-setopt.php";
seeAlso["doc-en#5791: How to flush cookies as of PHP8"] = "https://github.com/php/doc-en/pull/5791";
deprecation = "8.5";
phpVersion = "8.0";
alternatives[] = "Call curl_setopt($handle, CURLOPT_COOKIELIST, \"FLUSH\") before curl_close() to force the cookie jar to be written to disk.";
