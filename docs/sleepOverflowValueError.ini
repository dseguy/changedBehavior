id = "sleepOverflowValueError";
title = "sleep() Validates Its Seconds Argument Range";
description = "``sleep()``'s ``$seconds`` argument is passed to the operating system as an unsigned integer. Until PHP 8.6, a value greater than ``UINT_MAX`` (4294967295) silently overflowed, which could make the function sleep for a much shorter time than requested, or not at all. In PHP 8.6, a value greater than ``UINT_MAX`` throws a ``ValueError`` instead.";
code = "<?php

try {
    var_dump(sleep(4294967296));
} catch (\\ValueError $e) {
    echo \"ValueError: \".$e->getMessage().\"\\n\";
}

?>
";
before = "int(0)
";
after = "ValueError: sleep(): Argument #1 ($seconds) must be between 0 and 4294967295
";
seeAlso["sleep()"] = "https://www.php.net/sleep";
seeAlso["usleep()"] = "https://www.php.net/usleep";
deprecation = "";
phpVersion = "8.6";
alternatives[] = "Keep $seconds within the 0 to 4294967295 range, or catch the ValueError.";
related[] = "usleepOverflowValueError86";
keywords[] = "now_throw_exception";
features[] = "sleep";
features[] = "valueerror";
