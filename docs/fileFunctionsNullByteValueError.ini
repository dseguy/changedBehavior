id = "fileFunctionsNullByteValueError";
title = "Multiple File Functions Reject NUL Bytes In Filenames";
description = "Several filesystem functions, such as ``file_exists()``, used to accept a filename containing a NUL byte; the string was silently truncated by the underlying C library call, or the argument was simply rejected with a warning and a ``NULL``/``false`` return value. In PHP 8.6, a NUL byte in the filename argument of these file functions throws a ``ValueError`` instead.";
code = "<?php

try {
    var_dump(file_exists(\"/tmp/foo\\0bar\"));
} catch (\\ValueError $e) {
    echo $e->getMessage(), \"\\n\";
}

?>";
before = "PHP Warning:  file_exists() expects parameter 1 to be a valid path, string given in /codes/fileFunctionsNullByteValueError.php on line 4

Warning: file_exists() expects parameter 1 to be a valid path, string given in /codes/fileFunctionsNullByteValueError.php on line 4
NULL
";
after = "file_exists(): Argument #1 ($filename) must not contain any null bytes
";
seeAlso["file_exists()"] = "https://www.php.net/file_exists";
deprecation = "";
phpVersion = "8.6";
alternatives[] = "Validate the filename string before calling file_exists() or other file functions, or catch the ValueError.";
related[] = "dlNullByteValueError";
related[] = "getenvNullByteValueError";
related[] = "putenvNullByteValueError";
keywords[] = "now_throw_exception";
keywords[] = "error after";
features[] = "filesystem";
features[] = "null-byte";
features[] = "valueerror";
extension[] = "";
