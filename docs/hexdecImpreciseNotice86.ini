id = "hexdecImpreciseNotice86";
title = "hexdec() Warns When The Result Loses Precision";
description = "``hexdec()``, ``bindec()``, ``octdec()`` and ``base_convert()`` return a ``float`` when the converted number is too large to fit in a PHP integer. Until PHP 8.6, this silently lost precision, since a 64-bit float cannot represent every integer up to the represented magnitude exactly. In PHP 8.6, these functions raise a notice when the returned value cannot precisely represent the input number.";
code = "<?php

var_dump(hexdec('FFFFFFFFFFFFFFFFFF'));

?>
";
before = "float(4.722366482869645E+21)
";
after = "PHP Notice:  Input number is larger than PHP_INT_MAX, precision has been lost in conversion in /codes/hexdecImpreciseNotice86.php on line 3

Notice: Input number is larger than PHP_INT_MAX, precision has been lost in conversion in /codes/hexdecImpreciseNotice86.php on line 3
float(4.722366482869645E+21)
";
seeAlso["hexdec()"] = "https://www.php.net/hexdec";
deprecation = "";
phpVersion = "8.6";
alternatives[] = "Use an arbitrary-precision extension such as GMP or BCMath for numbers that exceed PHP_INT_MAX.";
