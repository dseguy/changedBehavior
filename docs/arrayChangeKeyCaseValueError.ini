id = "arrayChangeKeyCaseValueError";
title = "array_change_key_case() Validates Its Case Argument";
description = "``array_change_key_case()`` accepts a second argument, either ``CASE_LOWER`` or ``CASE_UPPER``. Until PHP 8.6, any other value was silently treated as ``CASE_LOWER``. In PHP 8.6, an invalid value throws a ``ValueError``.";
code = "<?php

var_dump(array_change_key_case(['A' => 1], 99));

?>";
before = "array(1) {
  ["A"]=>
  int(1)
}
";
after = "array_change_key_case(): Argument #2 ($case) must be either CASE_LOWER or CASE_UPPER";
seeAlso["array_change_key_case()"] = "https://www.php.net/array_change_key_case";
deprecation = "";
phpVersion = "8.6";
alternatives[] = "Only pass CASE_LOWER or CASE_UPPER as the second argument.";
related[] = "valueerror";
keywords[] = "now_throw_exception";
keywords[] = "error after";
features[] = "array";
features[] = "valueerror";
phpError["array_change_key_case(): Argument #2 ($case) must be either CASE_LOWER or CASE_UPPER"] = "array_change_key_case():-argument-#2-(\$case)-must-be-either-case_lower-or-case_upper";
analyzer[] = "none"
