id = "isDoubleIsLongDoubleValDeprecated";
title = "is_double(), is_long(), is_integer() And doubleval() Are Deprecated";
description = "``is_double()``, ``is_long()``, ``is_integer()`` and ``doubleval()`` have always been pure aliases for ``is_float()``, ``is_int()``, ``is_int()`` and ``floatval()`` respectively. Until PHP 8.6, calling any of these aliases produced no diagnostic. In PHP 8.6, calling any of them emits a deprecation notice pointing to the canonical function name, even though the alias keeps working exactly as before.";
code = "<?php

var_dump(is_double(1.5));
var_dump(is_long(1));
var_dump(is_integer(1));
var_dump(doubleval(\"1.5\"));

?>
";
before = "bool(true)
bool(true)
bool(true)
float(1.5)
";
after = "PHP Deprecated:  Function is_double() is deprecated since 8.6, use is_float() instead

Deprecated: Function is_double() is deprecated since 8.6, use is_float() instead
bool(true)
PHP Deprecated:  Function is_long() is deprecated since 8.6, use is_int() instead

Deprecated: Function is_long() is deprecated since 8.6, use is_int() instead
bool(true)
PHP Deprecated:  Function is_integer() is deprecated since 8.6, use is_int() instead

Deprecated: Function is_integer() is deprecated since 8.6, use is_int() instead
bool(true)
PHP Deprecated:  Function doubleval() is deprecated since 8.6, use floatval() instead

Deprecated: Function doubleval() is deprecated since 8.6, use floatval() instead
float(1.5)
";
seeAlso["is_double()"] = "https://www.php.net/is_double";
seeAlso["is_float()"] = "https://www.php.net/is_float";
seeAlso["is_long()"] = "https://www.php.net/is_long";
