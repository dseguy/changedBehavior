seeAlso["is_int()"] = "https://www.php.net/is_int";
seeAlso["doubleval()"] = "https://www.php.net/doubleval";
seeAlso["floatval()"] = "https://www.php.net/floatval";
deprecation = "8.6";
phpVersion = "";
alternatives[] = "Replace is_double() and doubleval() with is_float() and floatval(), and replace is_long() / is_integer() with is_int(). These are drop-in renames with identical behavior.";
