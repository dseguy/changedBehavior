id = "readonlyPropertyDefaultValue86";
title = "Readonly Properties Can Have Default Values";
description = "A ``readonly`` property could not declare a default value. Until PHP 8.6, doing so was a fatal compile-time error, ``Readonly property Class::$prop cannot have default value``. In PHP 8.6, a ``readonly`` property may declare a default value, which is used whenever the constructor does not explicitly initialize it. Assigning to the property once it already holds its default value, even from inside the constructor, still throws the usual ``Cannot modify readonly property`` error.";
code = "<?php

class Point {
    public readonly int $x = 0;
    public function __construct(?int $x = null) {
        if ($x !== null) {
            $this->x = $x;
        }
    }
}

$p = new Point();
var_dump($p->x);

try {
    $p2 = new Point(5);
    var_dump($p2->x);
} catch (\\Error $e) {
    echo \"Error: \".$e->getMessage().\"\\n\";
}

?>
";
before = "PHP Fatal error:  Readonly property Point::$x cannot have default value in /codes/readonlyPropertyDefaultValue86.php on line 4
";
after = "int(0)
Error: Cannot modify readonly property Point::$x
";
seeAlso["Readonly properties"] = "https://www.php.net/manual/en/language.oop5.properties.php#language.oop5.properties.readonly-properties";
seeAlso["PHP 8.6 NEWS"] = "https://www.php.net/ChangeLog-8.php#8.6.0";
deprecation = "";
phpVersion = "8.6";
alternatives[] = "If the default value is only a placeholder, keep assigning the real value unconditionally in the constructor; the Error only fires when the property is written a second time after already holding its default.";
