id = "gmpShiftValueError86";
title = "GMP Shift Operators Validate A GMP Right Operand";
description = "The GMP shift operators (``<<`` and ``>>``) accept a right operand outside the range of a regular PHP integer when it is itself a ``GMP`` object. Until PHP 8.6, a right operand greater than the platform's unsigned long maximum was silently truncated, producing an incorrect shift amount. In PHP 8.6, a right operand outside the unsigned long range throws a ``ValueError``.";
code = "<?php

$a = gmp_init(2);
$huge = gmp_init('18446744073709551616');

try {
    var_dump(gmp_strval($a << $huge));
} catch (\\ValueError $e) {
    echo \"ValueError: \".$e->getMessage().\"\\n\";
}

?>
";
before = "string(1) \"2\" 
";
after = "ValueError: Shift must be between 0 and 18446744073709551615
";
seeAlso["GMP"] = "https://www.php.net/gmp";
deprecation = "";
phpVersion = "8.6";
alternatives[] = "Keep the shift amount within the unsigned long range (0 to 18446744073709551615 on 64-bit platforms), or catch the ValueError.";
related[] = "";
keywords[] = "now_throw_exception";
features[] = "gmp";
features[] = "valueerror";
phpError["Shift must be between 0 and 18446744073709551615"] = "gmp-shift-operators-validate-a-gmp-right-operand";
analyzer[] = "none"
