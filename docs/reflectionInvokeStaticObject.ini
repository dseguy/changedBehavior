id = "reflectionInvokeStaticObject";
title = "ReflectionMethod::invoke() Deprecates Passing An Object For A Static Method";
description = "``ReflectionMethod::invoke()`` and ``ReflectionMethod::invokeArgs()`` take an object as the first argument, used as ``$this`` for instance methods. Until PHP 8.6, passing an object for a ``static`` method was silently accepted and the object was simply ignored. In PHP 8.6, passing a non-null object for a static method emits a deprecation notice, even though the call still succeeds.";
code = "<?php

class C {
    public static function staticMethod() {
        return \"called\";
    }
}

$rm = new ReflectionMethod(C::class, 'staticMethod');
var_dump($rm->invoke(new C()));

?>";
before = "string(6) \"called\" 
";
after = "PHP Deprecated:  Calling ReflectionMethod::invoke() for static method C::staticMethod() does not need an object parameter in /codes/reflectionInvokeStaticObject.php on line 10

Deprecated: Calling ReflectionMethod::invoke() for static method C::staticMethod() does not need an object parameter in /codes/reflectionInvokeStaticObject.php on line 10
string(6) \"called\" 
";
seeAlso["ReflectionMethod::invoke"] = "https://www.php.net/manual/en/reflectionmethod.invoke.php";
seeAlso["ReflectionMethod::invokeArgs"] = "https://www.php.net/manual/en/reflectionmethod.invokeargs.php";
deprecation = "8.6";
phpVersion = "";
alternatives[] = "Pass null as the object argument when invoking a static method through Reflection.";
related[] = "";
keywords[] = "deprecated";
features[] = "reflection";
features[] = "static";
extension[] = "Reflection";
phpError["Calling ReflectionMethod::invoke() for static method %s::%s() does not need an object parameter"] = "calling-reflectionmethod::invoke()-for-static-method-%s::%s()-does-not-need-an-object-parameter";
