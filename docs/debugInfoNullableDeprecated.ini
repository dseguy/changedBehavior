id = "debugInfoNullableDeprecated";
title = "__debugInfo() Nullable Return Type Is Deprecated";
description = "The magic method ``__debugInfo()`` used to be freely typed to return ``?array``, since ``null`` and ``array`` were both acceptable return values. In PHP 8.6, simply declaring ``__debugInfo()`` with a nullable ``?array`` return type is deprecated, regardless of what is actually returned: the return type should be made non-nullable, and an empty array should be returned instead of ``null``.";
code = "<?php

class x {
    public function __debugInfo(): ?array {
        return ['a' => 1];
    }
}

var_dump(new x());

?>";
before = "object(x)#1 (1) {
  ["a"]=>
  int(1)
}
";
after = "PHP Deprecated:  Returning null from x::__debugInfo() is deprecated, make the return type non-nullable and return an empty array instead

Deprecated: Returning null from x::__debugInfo() is deprecated, make the return type non-nullable and return an empty array instead
object(x)#1 (1) {
  ["a"]=>
  int(1)
}
";
seeAlso["PHP 8.6 NEWS"] = "https://www.php.net/ChangeLog-8.php#8.6.0";
deprecation = "8.6";
phpVersion = "";
alternatives[] = "Type __debugInfo() to return array, and return an empty array instead of null.";
related[] = "";
keywords[] = "";
features[] = "magic-method";
features[] = "deprecation";
phpError["Returning null from %s::__debugInfo() is deprecated, return an empty array instead"] = "returning-null-from-%s::__debuginfo()-is-deprecated,-return-an-empty-array-instead";
