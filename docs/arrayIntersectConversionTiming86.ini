id = "arrayIntersectConversionTiming86";
title = "array_intersect() Converts Values While Scanning Inputs";
description = "``array_intersect()`` compares values as strings. Until PHP 8.6, non-string values were converted to strings lazily, during the pairwise sort-based comparisons used internally. In PHP 8.6, all input arrays (once at least two are known to be non-empty) are scanned upfront and their values converted to strings before any comparison happens. This changes the number and order of conversion warnings and ``__toString()`` calls -- fewer calls overall, since each value is now converted once instead of possibly several times during comparisons -- and can change results for a stateful ``__toString()`` implementation.";
code = "<?php

class Stateful {
    private static $calls = 0;
    public function __toString(): string {
        self::$calls++;
        echo \"toString call #\".self::$calls.\"\\n\";
        return 'x';
    }
}

$a = [new Stateful()];
$b = ['x'];
$c = ['x'];

$result = array_intersect($a, $b, $c);
var_dump(count($result));

?>";
before = "toString call #1
toString call #2
int(1)
";
after = "toString call #1
int(1)
";
seeAlso["array_intersect()"] = "https://www.php.net/array_intersect";
deprecation = "";
phpVersion = "8.6";
alternatives[] = "Avoid relying on __toString() being called a specific number of times, or on the order in which array_intersect() converts its arguments.";
related[] = "";
keywords[] = "silent";
