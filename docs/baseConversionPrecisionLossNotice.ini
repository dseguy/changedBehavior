id = "baseConversionPrecisionLossNotice";
title = "Base Conversion Functions Warn When Precision Is Lost";
description = "``bindec()``, ``octdec()``, ``hexdec()`` and ``base_convert()`` all share the same internal conversion routine, which accumulates the result in a platform integer for as long as it fits, then switches to a ``float`` once the value would overflow. That switch already happened silently before PHP 8.6: a ``double`` only has 53 bits of mantissa, so digits beyond that are rounded away without any indication. In PHP 8.6, the switch to float now also emits an ``E_NOTICE``, while the returned value is unchanged.";
code = "<?php

var_dump(hexdec('FFFFFFFFFFFFFFFF'));

?>";
before = "float(1.8446744073709552E+19)
";
after = "PHP Notice:  Input number is larger than PHP_INT_MAX, precision has been lost in conversion in /codes/baseConversionPrecisionLossNotice.php on line 3

Notice: Input number is larger than PHP_INT_MAX, precision has been lost in conversion in /codes/baseConversionPrecisionLossNotice.php on line 3
float(1.8446744073709552E+19)
";
seeAlso["hexdec()"] = "https://www.php.net/hexdec";
seeAlso["PR #22371"] = "https://github.com/php/php-src/pull/22371";
deprecation = "";
phpVersion = "8.6";
alternatives[] = "Use the GMP or BCMath extensions to convert arbitrarily large numbers between bases without losing precision.";
alternatives[] = "Validate the input length against the base before conversion, so it is guaranteed to fit in a native integer.";
related[] = "";
keywords[] = "precision_loss";
keywords[] = "silent_to_visible";
features[] = "base-conversion";
features[] = "notice";
extension[] = "standard";
phpError["Input number is larger than PHP_INT_MAX, precision has been lost in conversion"] = "input-number-is-larger-than-php_int_max,-precision-has-been-lost-in-conversion";
analyzer[] = "none"
