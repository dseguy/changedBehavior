id = "gmpFloatOperandDeprecated";
title = "GMP Shift And Power Operators Deprecate Float Operands";
description = "The ``**``, ``<<`` and ``>>`` operators accept a ``float`` as the non-``GMP`` operand when the other operand is a ``GMP`` object. Until PHP 8.6, a float such as ``2.5`` was silently truncated to an integer before being used as the exponent or shift amount, discarding its fractional part without warning. In PHP 8.6, a float that would lose precision when converted emits a deprecation notice, ``Implicit conversion from float 2.5 to int loses precision``, before still truncating it the same way.";
code = "<?php

var_dump(gmp_strval(gmp_init(2) ** 2.5));
var_dump(gmp_strval(gmp_init(8) << 2.5));

?>
";
before = "string(1) \"4\" 
string(2) \"32\" 
";
after = "PHP Deprecated:  Implicit conversion from float 2.5 to int loses precision in /codes/gmpFloatOperandDeprecated.php on line 3

Deprecated: Implicit conversion from float 2.5 to int loses precision in /codes/gmpFloatOperandDeprecated.php on line 3
string(1) \"4\" 
PHP Deprecated:  Implicit conversion from float 2.5 to int loses precision in /codes/gmpFloatOperandDeprecated.php on line 4

Deprecated: Implicit conversion from float 2.5 to int loses precision in /codes/gmpFloatOperandDeprecated.php on line 4
string(2) \"32\" 
";
seeAlso["GMP"] = "https://www.php.net/gmp";
seeAlso["PHP 8.6 NEWS"] = "https://www.php.net/ChangeLog-8.php#8.6.0";
deprecation = "8.6";
phpVersion = "";
alternatives[] = "Cast the float to an int explicitly before using it as the exponent or shift amount, or use an integer value in the first place, to avoid the deprecation notice and make the truncation intentional.";
related[] = "gmpShiftValueError86";
keywords[] = "implicit_conversion";
features[] = "gmp";
features[] = "deprecation";
extension[] = "gmp";
phpError["Implicit conversion from float 2.5 to int loses precision"] = "gmp-shift-and-power-operators-deprecate-float-operands";
analyzer[] = "none"
