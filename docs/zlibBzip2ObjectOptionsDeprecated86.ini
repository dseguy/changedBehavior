id = "zlibBzip2ObjectOptionsDeprecated86";
title = "Passing An Object As Filter Options To zlib/bzip2 Functions Is Deprecated";
description = "``deflate_init()``, ``inflate_init()``, and the ``zlib.deflate``/``bzip2.compress`` stream filters accept an options value that PHP reads as an array. Until PHP 8.6, an object was silently accepted and read the same way as an array. In PHP 8.6, passing an object emits a deprecation notice recommending ``get_object_vars()`` first; the object's properties are still read the same way as before.";
code = "<?php

class Options {
    public $level = 6;
}

$context = deflate_init(ZLIB_ENCODING_RAW, new Options());
var_dump($context !== false);

?>
";
before = "bool(true)
";
after = "PHP Deprecated:  deflate_init(): Passing an object for argument #2 $option to deflate_init() is deprecated, call get_object_vars() first instead in /codes/zlibBzip2ObjectOptionsDeprecated86.php on line 7

Deprecated: deflate_init(): Passing an object for argument #2 $option to deflate_init() is deprecated, call get_object_vars() first instead in /codes/zlibBzip2ObjectOptionsDeprecated86.php on line 7
bool(true)
";
seeAlso["deflate_init()"] = "https://www.php.net/deflate_init";
