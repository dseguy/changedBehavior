seeAlso["stream_filter_append()"] = "https://www.php.net/stream_filter_append";
seeAlso["PHP 8.6 NEWS"] = "https://www.php.net/ChangeLog-8.php#8.6.0";
deprecation = "8.6";
phpVersion = "";
alternatives[] = "Pass get_object_vars($object) instead of $object to deflate_init(), inflate_init(), or stream_filter_append() when using the zlib.deflate or bzip2.compress filters.";
