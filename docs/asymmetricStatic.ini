id = "asymmetricStatic";
title = "Static Properties With Asymmetric Visibility";
description = "Asymmetric visibility was introduced in version 8.4. In that version, the asymmetric visibility was limited to non-static properties. In PHP 8.5, that feature is now extended to static properties.";
code = "<?php

class x {
    public private(set) static int $a = 3;
}

?>";
