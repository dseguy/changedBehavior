id = "arrayFilterModeValueError";
title = "array_filter() Validates Its Mode Argument";
description = "``array_filter()`` accepts a third argument that selects which values are passed to the callback: ``ARRAY_FILTER_USE_VALUE``, ``ARRAY_FILTER_USE_KEY``, or ``ARRAY_FILTER_USE_BOTH``. Until PHP 8.6, any other value was silently treated as ``0`` (``ARRAY_FILTER_USE_VALUE``). In PHP 8.6, an invalid mode throws a ``ValueError``.";
code = "<?php

var_dump(array_filter([1, 0, 2, null], fn($v) => true, 99));

?>";
before = "array(4) {
  [0]=>
  int(1)
  [1]=>
  int(0)
  [2]=>
  int(2)
  [3]=>
  NULL
}
";
after = "array_filter(): Argument #3 ($mode) must be one of ARRAY_FILTER_USE_VALUE, ARRAY_FILTER_USE_KEY, or ARRAY_FILTER_USE_BOTH";
seeAlso["array_filter()"] = "https://www.php.net/array_filter";
deprecation = "";
phpVersion = "8.6";
alternatives[] = "Only pass ARRAY_FILTER_USE_VALUE, ARRAY_FILTER_USE_KEY or ARRAY_FILTER_USE_BOTH as the third argument.";
related[] = "valueerror";
keywords[] = "now_throw_exception";
keywords[] = "error after";
features[] = "array_filter";
features[] = "valueerror";
phpError["array_filter(): Argument #3 ($mode) must be one of ARRAY_FILTER_USE_VALUE, ARRAY_FILTER_USE_KEY, or ARRAY_FILTER_USE_BOTH"] = "array_filter():-argument-#3-($mode)-must-be-one-of-array_filter_use_value,-array_filter_use_key,-or-array_filter_use_both";
analyzer[] = "none"
