id = "reflectionSetValueWrongObject";
title = "ReflectionProperty::setValue() Deprecates A Wrong Object Type";
description = "``ReflectionProperty::setValue()`` (and ``ReflectionProperty::setRawValue()``) accept an object as the first argument to set the property on. Until PHP 8.6, passing an object that is not an instance of the class the property was declared in was silently accepted, and the property was simply created on that unrelated object. In PHP 8.6, doing so emits a deprecation notice.";
code = "<?php

class A {
    public int $prop = 1;
}

class B {
    public int $prop = 0;
}

$rp = new ReflectionProperty(A::class, 'prop');
$rp->setValue(new B(), 42);
print \"done\n\";

?>";
before = "done
";
after = "PHP Deprecated:  Calling ReflectionProperty::setValue() with a given object that is not an instance of the class this property was declared in is deprecated in /codes/reflectionSetValueWrongObject.php on line 12

Deprecated: Calling ReflectionProperty::setValue() with a given object that is not an instance of the class this property was declared in is deprecated in /codes/reflectionSetValueWrongObject.php on line 12
done
";
seeAlso["ReflectionProperty::setValue"] = "https://www.php.net/manual/en/reflectionproperty.setvalue.php";
seeAlso["ReflectionProperty::setRawValue"] = "https://www.php.net/manual/en/reflectionproperty.setrawvalue.php";
deprecation = "8.6";
phpVersion = "";
alternatives[] = "Only pass an instance of the class (or a subclass) the property was declared in as the object argument.";
related[] = "";
keywords[] = "deprecated";
features[] = "reflection";
extension[] = "Reflection";
