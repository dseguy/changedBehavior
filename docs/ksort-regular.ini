id = "ksort-regular";
title = "ksort() now uses regular comparison";
description = "ksort() used a different sorting method to sort the keys than to sort the values. Since PHP 8.2, it uses the same method than sort() does on values. This means some values may have a different position.

This applies to krsort() too. It may apply to uksort(), depending on the code of the custom comparison function.";
code = "<?php

$array = [ 0, '-f' => 1, 'f' => 2];

ksort($array);

print_r($array);

?>";
before = "Array
(
    [0] => 0
    [-f] => 1
    [f] => 2
)
";
after = "Array
(
    [-f] => 1
    [0] => 0
    [f] => 2
)
";
seeAlso[] = "";
deprecation = "";
phpVersion = "8.2";
alternatives[] = "Make sure the keys are all of the same type (integer, string...) before sorting.";
alternatives[] = "Avoid using falsy values as key";
related[] = "";
phpError[] = "none";
features[] = "falsy";
features[] = "sort";
keywords[] = "silent change";
