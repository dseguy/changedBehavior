id = "overrideAttributeOnConstant86";
title = "Override Attribute Extended To Class Constants And Enum Cases";
description = "The ``#[\Override]`` attribute, introduced in PHP 8.3 for methods and extended to properties in PHP 8.5, is further extended in PHP 8.6 to class constants and enum cases (an enum case being internally a special kind of class constant). It tells the engine that the constant is expected to override a constant of the same name declared in a parent class or an implemented interface, so the engine can check that this is really the case.

If the constant marked ``#[\Override]`` has no matching parent constant -- because the parent/interface declares no constant of that name, or because the class has no parent and implements no interface at all -- PHP reports a compile-time error. Only public and protected constants of a parent class or implemented interface satisfy the attribute; private constants do not count.";
code = "<?php

interface Shape {
    const SIDES = 0;
}

class Square implements Shape {
    #[\Override]
    const SIDES = 4; // Fine, overrides Shape::SIDES

    #[\Override]
    const COLOR = 'blue'; // Fatal error, no matching parent constant
}

?>";
before = "PHP Fatal error:  Attribute \"Override\" cannot target class constant (allowed targets: method)

Fatal error: Attribute \"Override\" cannot target class constant (allowed targets: method)
";
after = "PHP Fatal error:  Square::COLOR has #[\Override] attribute, but no matching parent constant exists
";
seeAlso[] = "";
deprecation = "";
phpVersion = "8.6";
alternatives[] = "Remove the ``#[\Override]`` attribute.";
alternatives[] = "Rename the constant, or enum case, to match one declared in a parent class or interface.";
alternatives[] = "Add a constant with the same name to the parent class or interface.";
related[] = "overrideConstant";
keywords[] = "";
features[] = "override";
features[] = "attribute";
features[] = "class-constant";
features[] = "enum";
phpError["%s::%s has #[\Override] attribute"] = "%s::%s-has-#[--override]-attribute";
