id = "mbregexDeprecated";
title = "The mbstring Regex (mbregex) Functions Are Deprecated";
description = "The ``mb_ereg*()`` family of functions (``mb_ereg()``, ``mb_eregi()``, ``mb_ereg_match()``, ``mb_ereg_replace()``, ``mb_ereg_search()`` and its siblings, ``mb_split()``, and related functions) wraps the bundled Oniguruma regex library, which is no longer maintained upstream. Until PHP 8.6, calling any of these functions worked silently. In PHP 8.6, calling any mbregex function emits a deprecation notice, even though the function still behaves exactly as before.";
code = "<?php

var_dump(mb_ereg(\"^a\", \"abc\"));

?>
";
before = "bool(true)
";
after = "PHP Deprecated:  Function mb_ereg() is deprecated since 8.6, because the underlying library is no longer maintained in /codes/mbregexDeprecated.php on line 3

Deprecated: Function mb_ereg() is deprecated since 8.6, because the underlying library is no longer maintained in /codes/mbregexDeprecated.php on line 3
bool(true)
";
seeAlso["mb_ereg()"] = "https://www.php.net/mb_ereg";
seeAlso["PHP 8.6 UPGRADING notes"] = "https://github.com/php/php-src/blob/master/UPGRADING";
deprecation = "8.6";
phpVersion = "";
alternatives[] = "Replace mbregex calls (mb_ereg(), mb_eregi(), mb_ereg_match(), mb_ereg_replace(), mb_ereg_search() and siblings, mb_split()) with PCRE functions (preg_match(), preg_replace(), preg_split()) using the ``u`` modifier for UTF-8 aware matching.";
related[] = "";
keywords[] = "deprecation";
keywords[] = "sunset";
features[] = "regex";
features[] = "deprecation";
phpError["Function mb_ereg() is deprecated since 8.6, because the underlying library is no longer maintained"] = "function-mb_ereg()-is-deprecated-since-8.6,-because-the-underlying-library-is-no-longer-maintained";
analyzer[] = "none";
extension[] = "mbstring";
