id = "openlogNullByteValueError";
title = "openlog() Rejects NUL Bytes In The Prefix";
description = "``openlog()`` used to accept a syslog prefix containing a NUL byte and silently truncated it at the NUL byte. In PHP 8.6, a NUL byte in the argument throws a ``ValueError``.";
code = "<?php

try {
    var_dump(openlog(\"foo\\0bar\", LOG_PID, LOG_USER));
} catch (\\ValueError $e) {
    echo $e->getMessage(), \"\\n\";
}

?>";
before = "bool(true)
";
after = "openlog(): Argument #1 ($prefix) must not contain any null bytes
";
seeAlso["openlog()"] = "https://www.php.net/openlog";
deprecation = "";
phpVersion = "8.6";
alternatives[] = "Validate the prefix string before calling openlog(), or catch the ValueError.";
related[] = "getenv()-rejects-nul-bytes-in-the-variable-name";
keywords[] = "now_throw_exception";
features[] = "openlog";
features[] = "valueerror";
phpError["openlog(): Argument #1 ($prefix) must not contain any null bytes"] = "openlog():-argument-#1-($prefix)-must-not-contain-any-null-bytes";
analyzer[] = "none"
