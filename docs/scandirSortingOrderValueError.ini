id = "scandirSortingOrderValueError";
title = "scandir() Validates Its Sorting Order Argument";
description = "``scandir()`` accepts a second argument that selects the sort order of the returned entries: ``SCANDIR_SORT_ASCENDING``, ``SCANDIR_SORT_DESCENDING``, or ``SCANDIR_SORT_NONE``. Until PHP 8.6, any other value was silently accepted and treated as descending order. In PHP 8.6, an invalid sorting order throws a ``ValueError``.";
code = "<?php

$dir = sys_get_temp_dir() . '/scandir_86_test';
@mkdir($dir);
touch($dir . '/a.txt');
touch($dir . '/b.txt');

try {
    var_dump(scandir($dir, 99));
} catch (\\ValueError $e) {
    echo $e->getMessage(), \"\\n\";
}

?>";
before = "array(4) {
  [0]=>
  string(5) "b.txt"
  [1]=>
  string(5) "a.txt"
  [2]=>
  string(2) ".."
  [3]=>
  string(1) "."
}
";
after = "scandir(): Argument #2 ($sorting_order) must be one of the SCANDIR_SORT_ASCENDING, SCANDIR_SORT_DESCENDING, or SCANDIR_SORT_NONE constants
";
seeAlso["scandir()"] = "https://www.php.net/scandir";
deprecation = "";
phpVersion = "8.6";
alternatives[] = "Only pass SCANDIR_SORT_ASCENDING, SCANDIR_SORT_DESCENDING or SCANDIR_SORT_NONE as the second argument.";
related[] = "array_filter()-validates-its-mode-argument";
keywords[] = "now_throw_exception";
features[] = "scandir";
features[] = "valueerror";
phpError["scandir(): Argument #2 ($sorting_order) must be one of the SCANDIR_SORT_ASCENDING, SCANDIR_SORT_DESCENDING, or SCANDIR_SORT_NONE constants"] = "scandir():-argument-#2-($sorting_order)-must-be-one-of-the-scandir_sort_ascending,-scandir_sort_descending,-or-scandir_sort_none-constants";
