id = "getenvNullByteValueError";
title = "getenv() Rejects NUL Bytes In The Variable Name";
description = "``getenv()`` used to accept a variable name containing a NUL byte, and simply returned ``false`` since no such variable can exist. In PHP 8.6, a NUL byte in the name argument throws a ``ValueError``.";
code = "<?php

var_dump(getenv(\"FOO\0BAR\"));

?>";
before = "bool(false)
";
after = "getenv(): Argument #1 ($name) must not contain any null bytes";
seeAlso["getenv()"] = "https://www.php.net/getenv";
deprecation = "";
phpVersion = "8.6";
alternatives[] = "Check that the variable name does not contain a NUL byte before calling getenv().";
related[] = "valueerror";
keywords[] = "now_throw_exception";
keywords[] = "error after";
features[] = "null-byte";
features[] = "valueerror";
phpError["getenv(): Argument #1 ($name) must not contain any null bytes"] = "getenv():-argument-#1-($name)-must-not-contain-any-null-bytes";
analyzer[] = "none"
