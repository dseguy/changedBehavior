id = "constantExpressionMethodNameResolution85";
title = "First-Class Callables Inside Constant Expressions Must Resolve To A Literal Method Name";
description = "PHP 8.5 allows first-class callable syntax (``(...)``) to be used inside a constant expression -- a global constant, a class constant, a static property default, a parameter default value, and so on -- so that a static method can be turned into a ``Closure`` at compile time. To build that closure, the method name must be resolvable at compile time, which introduces two new, related compile errors for static method calls (``X::method(...)``):

'Cannot use dynamic method name in constant expression' is reported when the braced method-name expression cannot be folded down to a constant value at all -- for example because it is an array, or depends on something not known at compile time.

'Illegal method name' is reported when the braced expression does resolve to a compile-time constant, but that value is not a legal method name, such as an integer.

The equivalent restrictions for a plain function name (rather than a static method) are reported as 'Cannot use dynamic function name in constant expression' and 'Illegal function name'.";
code = "<?php

class X {
    public static function foo() { return 1; }
}

const C1 = X::{[1, 2]}(...); // Cannot use dynamic method name in constant expression

const C2 = X::{0}(...); // Illegal method name

?>";
before = "";
after = "PHP Fatal error:  Cannot use dynamic method name in constant expression
";
seeAlso[] = "";
deprecation = "";
phpVersion = "8.5";
alternatives[] = "Use a literal string for the method name.";
alternatives[] = "Move the closure creation out of the constant expression, into ordinary code, where dynamic method names are allowed.";
