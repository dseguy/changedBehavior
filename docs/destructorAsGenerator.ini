id = "destructorAsGenerator";
title = "Making A Destructor A Generator Is Deprecated";
description = "Using ``yield`` anywhere in the body of ``__destruct()`` turns it into a Generator function. A Generator only starts executing once something iterates it, but nothing iterates the return value of a destructor: PHP just calls it during garbage collection and discards the result. As a consequence, the body of such a destructor never actually runs, silently skipping any cleanup code it contains. Since this pattern is virtually always a mistake, PHP 8.6 deprecates making a destructor a Generator.";
code = "<?php

class X {
    public function __destruct() {
        yield 1;
    }
}

\$x = new X;
unset(\$x);

?>";
before = "";
after = "PHP Deprecated:  Making a destructor a Generator is deprecated in /codes/destructorAsGenerator.php on line 4

Deprecated: Making a destructor a Generator is deprecated in /codes/destructorAsGenerator.php on line 4
";
seeAlso["Generator overview"] = "https://www.php.net/manual/en/language.generators.overview.php";
seeAlso["Constructors and destructors"] = "https://www.php.net/manual/en/language.oop5.decon.php";
deprecation = "8.6";
phpVersion = "8.6";
alternatives[] = "Move the code that uses ``yield`` into a separate, regular method that ``__destruct()`` calls directly.";
alternatives[] = "If the destructor only needs to release resources, replace ``yield`` with plain statements.";
