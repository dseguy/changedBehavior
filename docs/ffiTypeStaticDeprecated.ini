id = "ffiTypeStaticDeprecated";
title = "Calling FFI::type() statically is deprecated";
description = "``type()``, ``cast()`` and ``new()`` are instance methods of the object returned by ``FFI::cdef()`` or ``FFI::load()``: each loaded C definition scope has its own set of types, so resolving a type name should happen on that specific instance. PHP used to allow calling these methods statically as ``FFI::type()``, in which case they implicitly operated on an anonymous, definition-less scope. Since PHP 8.3, this static shortcut is deprecated, because it is ambiguous about which set of C declarations is being used.";
code = "<?php

FFI::cdef('typedef struct { int x; int y; } point;');

$type = FFI::type('point');

var_dump($type);

?>";
before = "object(FFI\CType)#2 (0) {
}
";
after = "PHP Deprecated:  Calling FFI::type() statically is deprecated in /codes/ffiTypeStaticDeprecated.php on line 5

Deprecated: Calling FFI::type() statically is deprecated in /codes/ffiTypeStaticDeprecated.php on line 5
object(FFI\CType)#2 (0) {
}
";
seeAlso[] = "";
deprecation = "";
phpVersion = "8.3";
alternatives[] = "Call ``type()`` on the ``FFI`` instance returned by ``FFI::cdef()`` or ``FFI::load()`` instead of calling it statically: ``$ffi->type(...)``.";
