id = "curlReadFunctionValueError";
title = "CURLOPT_READFUNCTION Callback Validates Its Return Value";
description = "A ``CURLOPT_READFUNCTION`` callback is expected to return the chunk of data to upload, the empty string, ``CURL_READFUNC_ABORT``, or ``CURL_READFUNC_PAUSE``. Until PHP 8.6, an invalid return value, such as an arbitrary integer, was passed straight to libcurl, which simply aborted the transfer without any diagnostic from PHP. In PHP 8.6, ``curl_exec()`` throws a ``ValueError`` when the callback returns something other than a string, ``CURL_READFUNC_ABORT``, or ``CURL_READFUNC_PAUSE``.";
code = "<?php

$docroot = sys_get_temp_dir() . '/curlrf' . getmypid();
mkdir($docroot);
file_put_contents($docroot . '/upload.php', '<?php echo \"ok\";');

$port = 8391;
$server = proc_open(
    PHP_BINARY . ' -S 127.0.0.1:' . $port . ' -t ' . escapeshellarg($docroot),
    [1 => ['pipe', 'w'], 2 => ['pipe', 'w']],
    $pipes
);
usleep(500000);

$ch = curl_init('http://127.0.0.1:' . $port . '/upload.php');
curl_setopt($ch, CURLOPT_UPLOAD, true);
curl_setopt($ch, CURLOPT_INFILESIZE, 5);
curl_setopt($ch, CURLOPT_READFUNCTION, function ($ch, $fh, $length) {
    return 999;
});
curl_setopt($ch, CURLOPT_RETURNTRANSFER, true);
curl_setopt($ch, CURLOPT_TIMEOUT, 5);

try {
    $result = curl_exec($ch);
    var_dump($result);
} catch (\\ValueError $e) {
    echo $e->getMessage(), \"\\n\";
}

proc_terminate($server);
proc_close($server);
unlink($docroot . '/upload.php');
rmdir($docroot);

?>";
before = "bool(false)
";
after = "The CURLOPT_READFUNCTION callback must return a string or CURL_READFUNC_ABORT or CURL_READFUNC_PAUSE
";
seeAlso["curl_setopt()"] = "https://www.php.net/curl_setopt";
seeAlso["CURLOPT_READFUNCTION"] = "https://www.php.net/manual/en/function.curl-setopt.php";
deprecation = "";
phpVersion = "8.6";
alternatives[] = "Make the CURLOPT_READFUNCTION callback always return a string chunk (possibly empty), CURL_READFUNC_ABORT, or CURL_READFUNC_PAUSE.";
related[] = "curl_init";
keywords[] = "now_throw_exception";
keywords[] = "error after";
features[] = "curl";
features[] = "valueerror";
extension[] = "curl";
phpError["The CURLOPT_READFUNCTION callback must return a string or CURL_READFUNC_ABORT or CURL_READFUNC_PAUSE"] = "the-curlopt_readfunction-callback-must-return-a-string-or-curl_readfunc_abort-or-curl_readfunc_pause";
analyzer[] = "none"
