id = "metaphoneDeprecated86";
title = "metaphone() Is Deprecated";
description = "``metaphone()`` computes a phonetic key for an ASCII string. In PHP 8.6, calling it emits a deprecation notice recommending a userland phonetic matching library instead; the function still returns the same key as before.";
code = "<?php

var_dump(metaphone(\"Thompson\"));

?>
";
before = "string(5) \"0MPSN\" 
";
