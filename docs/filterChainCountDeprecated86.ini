id = "filterChainCountDeprecated86";
title = "Long php://filter Chains Are Deprecated";
description = "A ``php://filter`` URL can chain several filters with ``|``. Until PHP 8.6, any number of filters could be chained silently. In PHP 8.6, opening a ``php://filter`` URL with more than 16 chained filters emits a deprecation notice suggesting the ``max_filter_count`` stream context option or ``stream_filter_append()`` instead.";
code = "<?php

$filters = str_repeat('string.toupper|', 20);
$handle = fopen('php://filter/read='.$filters.'/resource=php://memory', 'r');
var_dump($handle !== false);

?>
";
before = "bool(true)
";
after = "PHP Deprecated:  Using more than 16 filters in a php://filter URL is deprecated, set this limit using the stream context option max_filter_count, or use stream_filter_append in /codes/filterChainCountDeprecated86.php on line 4

Deprecated: Using more than 16 filters in a php://filter URL is deprecated, set this limit using the stream context option max_filter_count, or use stream_filter_append in /codes/filterChainCountDeprecated86.php on line 4
bool(true)
";
seeAlso["Filters"] = "https://www.php.net/manual/en/filters.php";
seeAlso["stream_filter_append"] = "https://www.php.net/stream_filter_append";
seeAlso["PHP 8.6 NEWS"] = "https://www.php.net/ChangeLog-8.php#8.6.0";
deprecation = "8.6";
phpVersion = "";
alternatives[] = "Keep php://filter chains at 16 filters or fewer, raise the limit explicitly via the max_filter_count stream context option, or build the chain with repeated stream_filter_append() calls instead.";
related[] = "";
keywords[] = "php://filter";
keywords[] = "deprecation";
features[] = "streams";
features[] = "deprecation";
