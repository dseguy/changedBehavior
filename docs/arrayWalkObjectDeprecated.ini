id = "arrayWalkObjectDeprecated";
title = "Passing An Object To array_walk() Is Deprecated";
description = "``array_walk()`` and ``array_walk_recursive()`` have always accepted an object as their first argument, walking its accessible public properties as if they were an array. Until PHP 8.6, this worked silently. In PHP 8.6, passing an object to either function emits a deprecation notice suggesting ``get_object_vars()`` first, even though the walk itself still happens and mutates the object's properties exactly as before.";
code = "<?php

class Point {
    public $x = 1;
    public $y = 2;
}

$p = new Point();
array_walk($p, function (&$value, $key) {
    $value = $value * 10;
});
var_dump($p);

?>
";
before = "object(Point)#1 (2) {
  [\"x\"]=>
  int(10)
  [\"y\"]=>
  int(20)
}
";
after = "PHP Deprecated:  array_walk(): Passing an object for argument #1 $array to array_walk() is deprecated, call get_object_vars() first instead

Deprecated: array_walk(): Passing an object for argument #1 $array to array_walk() is deprecated, call get_object_vars() first instead
object(Point)#1 (2) {
  [\"x\"]=>
  int(10)
  [\"y\"]=>
  int(20)
}
";
seeAlso["array_walk()"] = "https://www.php.net/array_walk";
seeAlso["array_walk_recursive()"] = "https://www.php.net/array_walk_recursive";
seeAlso["get_object_vars()"] = "https://www.php.net/get_object_vars";
deprecation = "8.6";
phpVersion = "";
alternatives[] = "Call get_object_vars($obj) to get an array of the object's accessible properties, walk that array, then reassign the properties back if mutation is needed.";
related[] = "";
keywords[] = "deprecation";
keywords[] = "object";
features[] = "array_walk";
