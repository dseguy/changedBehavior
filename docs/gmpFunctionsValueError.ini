id = "gmpFunctionsValueError";
title = "Several GMP Functions Validate Their Numeric Arguments";
description = "``gmp_fact()`` accepts a ``GMP`` object as its ``$num`` argument. Until PHP 8.6, a value outside the range of an unsigned long was silently misinterpreted, so ``gmp_fact()`` returned an unrelated, incorrect result instead of failing. In PHP 8.6, such a value throws a ``ValueError``. The same release also refines the ``ValueError`` messages already thrown by ``gmp_pow()``, ``gmp_binomial()``, ``gmp_root()`` and ``gmp_rootrem()`` for an out-of-range second argument (``$exponent``, ``$k`` or ``$nth``), now stating the full valid range instead of only the lower bound.";
code = "<?php

$huge = gmp_init('18446744073709551616');

try {
    var_dump(gmp_strval(gmp_fact($huge)));
} catch (\\ValueError $e) {
    echo \"ValueError: \".$e->getMessage().\"\\n\";
}

?>
";
before = "string(1) \"1\" 
";
after = "ValueError: gmp_fact(): Argument #1 ($num) must be between 0 and 18446744073709551615
";
seeAlso["gmp_fact"] = "https://www.php.net/gmp_fact";
seeAlso["gmp_pow"] = "https://www.php.net/gmp_pow";
seeAlso["gmp_binomial"] = "https://www.php.net/gmp_binomial";
seeAlso["gmp_root"] = "https://www.php.net/gmp_root";
seeAlso["gmp_rootrem"] = "https://www.php.net/gmp_rootrem";
deprecation = "";
phpVersion = "8.6";
alternatives[] = "Keep $num within the unsigned long range (0 to 18446744073709551615 on 64-bit platforms), or catch the ValueError around gmp_fact() and the other affected functions.";
