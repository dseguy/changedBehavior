id = "splObjectStorageGetHashMutation86";
title = "SplObjectStorage::getHash() May No Longer Mutate Storage";
description = "A custom ``getHash()`` implementation in an ``SplObjectStorage`` subclass used to be free to mutate any ``SplObjectStorage`` instance, including a different one than the one currently being hashed, while computing the hash. In PHP 8.6, attempting such a mutation from inside ``getHash()`` throws an ``Error``, because ``SplObjectStorage`` internals are not reentrant during hashing.";
code = "<?php

class WatchfulStorage extends SplObjectStorage {
    public SplObjectStorage $sideStorage;
    public function getHash(object $object): string {
        $this->sideStorage->offsetSet(new stdClass());
        return spl_object_hash($object);
    }
}

$watch = new WatchfulStorage();
$watch->sideStorage = new SplObjectStorage();

try {
    $watch->offsetSet(new stdClass());
    echo \"offsetSet succeeded, sideStorage count=\".count($watch->sideStorage).\"\\n\";
} catch (\\Error $e) {
    echo \"Error: \".$e->getMessage().\"\\n\";
}

?>
";
before = "offsetSet succeeded, sideStorage count=1
";
after = "Error: Modification of SplObjectStorage during getHash() is prohibited
";
seeAlso["SplObjectStorage::getHash()"] = "https://www.php.net/splobjectstorage.gethash";
deprecation = "";
phpVersion = "8.6";
alternatives[] = "Move any storage mutation performed by getHash() outside of that method.";
related[] = "";
keywords[] = "now_throw_exception";
features[] = "splobjectstorage";
features[] = "spl";
phpError["Modification of SplObjectStorage during getHash() is prohibited"] = "modification-of-splobjectstorage-during-gethash()-is-prohibited";
