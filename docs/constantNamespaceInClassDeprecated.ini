id = "constantNamespaceInClassDeprecated";
title = "Declaring A Class Constant Named namespace Is Deprecated";
description = "``namespace`` is a reserved word in PHP, but a historical lexer exception allowed it to be used as the name of a class, interface, trait or enum constant, as well as a static property. Until PHP 8.6, declaring such a constant produced no warning. In PHP 8.6, declaring a constant called ``namespace`` emits a deprecation notice, reserving the word for a possible future ``::namespace`` pseudo-constant, analogous to the existing ``::class``.";
code = "<?php

class Foo {
    const NAMESPACE = 'bar';
}

echo Foo::NAMESPACE, \"\\n\";

?>";
before = "bar
";
after = "PHP Deprecated:  Declaring class constant \"namespace\" is deprecated in /codes/constantNamespaceInClassDeprecated.php on line 4

Deprecated: Declaring class constant \"namespace\" is deprecated in /codes/constantNamespaceInClassDeprecated.php on line 4
bar
";
seeAlso["PHP 8.6 Deprecations RFC"] = "https://wiki.php.net/rfc/deprecations_php_8_6";
seeAlso["PHP 8.6 NEWS"] = "https://www.php.net/ChangeLog-8.php#8.6.0";
deprecation = "8.6";
phpVersion = "";
alternatives[] = "Rename the constant to something other than NAMESPACE.";
related[] = "";
keywords[] = "reserved_word";
keywords[] = "class_constant";
features[] = "namespace";
features[] = "deprecation";
extension[] = "Core";
phpError["Declaring class constant \"namespace\" is deprecated"] = "declaring-%s-constant-called-namespace-is-deprecated";
analyzer[] = "none"
