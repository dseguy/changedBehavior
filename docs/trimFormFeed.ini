id = "trimFormFeed";
title = "trim() Strips Form Feed By Default";
description = "``trim()``, ``ltrim()`` and ``rtrim()`` remove a fixed set of characters by default when no second argument is provided. Until PHP 8.6, that set was space, tab, newline, carriage return, NUL byte and vertical tab. In PHP 8.6, the form feed character (``\\f``, ``\\x0C``) was added to that default set.";
code = "<?php

var_dump(trim(\"\fHello\f\"));

?>";
before = "string(7) "Hello"
";
after = "string(5) "Hello"
";
seeAlso["PHP 8.6 NEWS"] = "https://www.php.net/ChangeLog-8.php#8.6.0";
deprecation = "";
phpVersion = "8.6";
alternatives[] = "Pass the characters to trim explicitly, including \"\\f\", if the default set of PHP 8.6 is not wanted.";
related[] = "";
keywords[] = "silent";
features[] = "trim";
features[] = "string";
phpError[] = "none";
analyzer[] = "none"
