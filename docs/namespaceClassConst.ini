id = "namespaceClassConst";
title = "namespace Is Not Valid As A Class Constant Name";
description = "namespace is a PHP keyword, and it is allowed inside class for naming methods or properties. After PHP 8.6, it is not possible to use it for constant name.

The actual motivation is a future feature: reserving namespace would allow a future ``::namespace`` pseudo-constant, analogous to ``::class``, for directory namespaces. For example, replacing stringy APIs like ``Order\\Domain\\Entities`` with ``\Order\Domain\Entities::namespace``, which gives you IDE support, refactoring, and static analysis for free.";
code = "<?php

class x { const namespace= 1;}

echo x::namespace;

?>";
before = "1";
after = "PHP Deprecated:  Declaring class constant called 'namespace' is deprecated in /codes/namespaceClassConst.php on line 3

