id = "dlNullByteValueError";
title = "dl() Rejects NUL Bytes In The Extension Filename";
description = "``dl()`` used to accept an extension filename containing a NUL byte and only reported the standard warning once ``enable_dl`` turned out to be off. In PHP 8.6, a NUL byte in the argument throws a ``ValueError`` before that check is even reached.";
code = "<?php

try {
    var_dump(dl(\"foo\\0bar\"));
} catch (\\ValueError $e) {
    echo $e->getMessage(), \"\\n\";
}

?>";
before = "PHP Warning:  dl(): Dynamically loaded extensions aren't enabled in /codes/dlNullByteValueError.php on line 4

Warning: dl(): Dynamically loaded extensions aren't enabled in /codes/dlNullByteValueError.php on line 4
bool(false)
";
after = "dl(): Argument #1 ($extension_filename) must not contain any null bytes
";
seeAlso["dl()"] = "https://www.php.net/dl";
deprecation = "";
phpVersion = "8.6";
alternatives[] = "Validate the extension filename before calling dl(), or catch the ValueError.";
related[] = "getenv()-rejects-nul-bytes-in-the-variable-name";
keywords[] = "now_throw_exception";
features[] = "dl";
features[] = "valueerror";
phpError["dl(): Argument #1 ($extension_filename) must not contain any null bytes"] = "dl():-argument-#1-($extension_filename)-must-not-contain-any-null-bytes";
analyzer[] = "none"
