id = "putenvNullByteValueError";
title = "putenv() Rejects NUL Bytes In The Assignment";
description = "``putenv()`` used to accept an assignment string containing a NUL byte and silently truncated it at the NUL byte, setting an environment variable from the part before it. In PHP 8.6, a NUL byte in the argument throws a ``ValueError``.";
code = "<?php

try {
    var_dump(putenv(\"FOO\\0BAR=1\"));
} catch (\\ValueError $e) {
    echo $e->getMessage(), \"\\n\";
}

?>";
before = "bool(true)
";
after = "putenv(): Argument #1 ($assignment) must not contain any null bytes
";
seeAlso["putenv()"] = "https://www.php.net/putenv";
deprecation = "";
phpVersion = "8.6";
alternatives[] = "Validate the assignment string before calling putenv(), or catch the ValueError.";
related[] = "getenv()-rejects-nul-bytes-in-the-variable-name";
keywords[] = "now_throw_exception";
features[] = "putenv";
features[] = "valueerror";
phpError["putenv(): Argument #1 ($assignment) must not contain any null bytes"] = "putenv():-argument-#1-($assignment)-must-not-contain-any-null-bytes";
analyzer[] = "none"
