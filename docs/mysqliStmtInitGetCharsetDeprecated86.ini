id = "mysqliStmtInitGetCharsetDeprecated86";
title = "mysqli::stmt_init() And mysqli_get_charset() Are Deprecated";
description = "``mysqli::stmt_init()`` creates a statement object to prepare later, and ``mysqli_get_charset()`` returns information about the connection's current character set. In PHP 8.6, calling either emits a deprecation notice, recommending ``mysqli::prepare()`` and ``mysqli_character_set_name()`` respectively; both functions keep their previous behavior otherwise.";
code = "<?php

$mysqli = new mysqli();

try {
    $mysqli->stmt_init();
} catch (\\Error $e) {
    echo \"Error: \".$e->getMessage().\"\\n\";
}

try {
    var_dump(mysqli_get_charset($mysqli));
} catch (\\Error $e) {
    echo \"Error: \".$e->getMessage().\"\\n\";
}

?>
";
