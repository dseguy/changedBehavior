id = "array-intersect-string-conversion";
title = "array_intersect() Calls __toString() Once Per Value";
description = "``array_intersect()`` compares values as strings, so an object with ``__toString()`` is converted to a string when it is compared. Until PHP 8.5, with two non-empty input arrays, each object could be converted several times during the comparisons: the example below calls ``__toString()`` six times. In PHP 8.6, every value is converted once, before any comparison, and the same example calls it twice. The number and order of the calls change, and so do any warnings or side effects they produce. Argument types are checked before any conversion, so an invalid later argument raises a ``TypeError`` without calling ``__toString()``, and if any input array is empty, no value is converted.";
code = "<?php

class Label
{
    public function __construct(private int $n) {}

    public function __toString(): string
    {
        echo \"  __toString({$this->n}) called\\n\";
        return \"v{$this->n}\";
    }
}

var_dump(count(array_intersect([new Label(1), new Label(2)], ['v1', 'v9'])));

?>";
before = "  __toString(1) called
  __toString(2) called
  __toString(1) called
  __toString(1) called
  __toString(2) called
  __toString(2) called
int(1)
";
after = "  __toString(1) called
  __toString(2) called
int(1)
";
seeAlso["array_intersect()"] = "https://www.php.net/array_intersect";
deprecation = "";
phpVersion = "8.6";
alternatives[] = "Avoid relying on __toString() being called a specific number of times, or on the order in which array_intersect() converts its values.";
related[] = "arrayIntersectConversionTiming86";
