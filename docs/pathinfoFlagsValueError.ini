id = "pathinfoFlagsValueError";
title = "pathinfo() Validates Its Flags Argument";
description = "``pathinfo()`` accepts a second argument made of ``PATHINFO_*`` constants. Until PHP 8.6, any other value was silently accepted, and the whole set of parts was returned. In PHP 8.6, an invalid value throws a ``ValueError``.";
code = "<?php

var_dump(pathinfo('/foo/bar.txt', 999));

?>";
before = "string(4) "/foo"
";
after = "pathinfo(): Argument #2 ($flags) must be one of the PATHINFO_* constants";
seeAlso["pathinfo()"] = "https://www.php.net/pathinfo";
deprecation = "";
phpVersion = "8.6";
alternatives[] = "Only pass one of the PATHINFO_* constants, or a bitwise combination of them.";
related[] = "valueerror";
keywords[] = "now_throw_exception";
keywords[] = "error after";
features[] = "valueerror";
phpError["pathinfo(): Argument #2 ($flags) must be one of the PATHINFO_* constants"] = "pathinfo():-argument-#2-($flags)-must-be-one-of-the-pathinfo_*-constants";
analyzer[] = "none"
